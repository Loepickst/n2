<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Try! N2 第1课｜课文学习</title>
  <link rel="stylesheet" href="../../shared/site-fonts.css">
  <link rel="stylesheet" href="../../shared/word-bank.css">
  <link rel="stylesheet" href="../../shared/grammar-learning-favorites.css?v=20260731-1">
  <style>
    :root {
      --bg: #ffffff;
      --paper: #ffffff;
      --ink: #23231f;
      --muted: #6f6962;
      --faint: #9d958d;
      --line: #e3ddd5;
      --sage: #8a4a40;
      --sage-dark: #743b33;
      --sage-soft: #fbf4f1;
      --nav-surface: #faf7f2;
      --nav-surface-hover: #f7f1ea;
      --nav-surface-active: #f3ece4;
      --nav-line: #ded7cf;
      --nav-ink: #302d29;
      --nav-muted: #655f58;
      --coral: #a45b50;
      --blue: #6f6a64;
      --shadow: 0 8px 24px rgba(64, 53, 45, 0.04);
      --radius: 10px;
      --sans: var(--site-font-ui, "Hiragino Sans", "Yu Gothic", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
      --serif: var(--site-font-display, "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
      text-rendering: optimizeLegibility;
    }

    body {
      overflow: hidden;
    }

    body.modal-open {
      overflow: hidden !important;
    }

    body.hide-ruby .lesson-paper rt {
      visibility: hidden;
    }

    body:not(.show-trans) .translation {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    button,
    select {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      gap: 14px;
      width: 100vw;
      height: calc(100vh - var(--site-header-height, 0px));
      padding: 14px;
      background: #fff;
      overflow: hidden;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .workspace {
      display: flex;
      flex-direction: column;
      background: #fff;
      background-color: #fff;
      background-image: none;
      overflow: hidden;
    }

    .course-brand,
    .sidebar-title,
    .lesson-nav button,
    .reader-head,
    .title-line,
    .title-copy,
    .title-tools,
    .title-toggle,
    .bottom-dock,
    .audio-box,
    .audio-meta,
    .audio-progress-row,
    .audio-loop-button,
    .audio-speed-button,
    .audio-part-button,
    .detail-head,
    .detail-tag,
    .detail-close,
    .grammar-modal-head,
    .grammar-modal-badges,
    .grammar-detail-open,
    .grammar-textbook-open {
      display: flex;
      align-items: center;
    }

    .left-nav {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 16px 18px;
      border-color: var(--nav-line);
      background: var(--nav-surface);
      color: var(--nav-ink);
      box-shadow: none;
      overflow: hidden;
    }

    .course-brand {
      min-height: 52px;
      padding: 0 16px 13px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--nav-line);
      color: var(--nav-ink);
      font-size: 17px;
      font-weight: 720;
      line-height: 1.2;
      white-space: nowrap;
    }

    .sidebar-title {
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 30px;
      padding: 0 16px;
      border: 0;
      background: transparent;
      border-radius: 6px;
      color: var(--nav-ink);
      font-size: 12px;
      font-weight: 720;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-title:hover {
      background: var(--nav-surface-hover);
    }

    .sidebar-title .menu-chevron {
      transition: transform 160ms ease;
    }

    .left-nav.collapsed .sidebar-title .menu-chevron {
      transform: rotate(90deg);
    }

    .sidebar-title span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      overflow: hidden;
      transition: max-height 180ms ease, opacity 140ms ease;
      max-height: 240px;
      opacity: 1;
    }

    .lesson-nav.no-transition {
      transition: none;
    }

    .left-nav.collapsed .lesson-nav {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .lesson-nav button {
      gap: 12px;
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--nav-muted);
      font-size: 12px;
      font-weight: 660;
      text-align: left;
    }

    .lesson-nav button.active {
      background: var(--nav-surface-active);
      color: var(--sage-dark);
      box-shadow: inset 3px 0 0 var(--sage);
    }

    .lesson-nav button:not(.active):hover {
      background: var(--nav-surface-hover);
      color: var(--nav-ink);
    }

    .lesson-nav .icon {
      width: 15px;
      height: 15px;
      color: currentColor;
    }

    .reader {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #fff;
      background-color: #fff;
      background-image: none;
      overflow: hidden;
    }

    .reader-head {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 22px 34px 0 42px;
      background: #fff;
      background-color: #fff;
      background-image: none;
      flex: 0 0 auto;
    }

    .title-line {
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
    }

    .title-copy {
      min-width: 0;
      gap: 14px;
    }

    .lesson-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 680;
      line-height: 1.1;
      letter-spacing: 0;
      min-width: 0;
    }

    .sakura {
      color: #dda095;
      font-size: 25px;
      line-height: 1;
    }

    .title-tools {
      gap: 8px;
      flex: 0 0 auto;
    }

    .title-toggle {
      justify-content: center;
      gap: 6px;
      height: 31px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #54584f;
      font-size: 11px;
      font-weight: 680;
      white-space: nowrap;
    }

    .title-toggle .icon {
      width: 15px;
      height: 15px;
    }

    .title-toggle.active {
      border-color: #b9958e;
      background: var(--sage-soft);
      color: var(--sage-dark);
    }

    .reader-body {
      flex: 1;
      min-height: 0;
      padding: 34px 34px 104px 42px;
      background: #fff;
      background-color: #fff;
      background-image: none;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .lesson-paper {
      display: block;
      min-height: 520px;
      background: #fff;
      background-color: #fff;
      background-image: none;
    }

    .lesson-section-panel {
      width: 100%;
      max-width: 1240px;
      margin-right: auto;
      margin-left: auto;
    }

    .paper-content {
      min-width: 0;
      width: 100%;
      padding-top: 4px;
      background: #fff;
      background-color: #fff;
      background-image: none;
    }

    .lesson-header,
    .job-title-box {
      display: none;
    }

    .job-notice {
      display: block;
      border: 0;
      background: #fff;
      background-color: #fff;
      background-image: none;
      font-family: var(--serif);
      color: var(--ink);
    }

    .job-row {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 14px;
      padding: 0;
      border: 0;
      margin-bottom: 20px;
    }

    .job-label {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--sage-dark);
      font-family: var(--sans);
      font-size: 17px;
      font-weight: 790;
      line-height: 1.98;
      text-align: left;
    }

    .job-content {
      min-width: 0;
      font-size: 17px;
      font-weight: 620;
      line-height: 1.98;
    }

    .text-group + .text-group {
      margin-top: 12px;
    }

    ruby rt {
      color: #62665d;
      font-size: 0.5em;
      font-weight: 580;
      letter-spacing: 0;
    }

    .translation {
      margin: 5px 0 0;
      padding: 7px 9px;
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 560;
      line-height: 1.48;
    }

    .vocab-point,
    .grammar-point {
      border-radius: 5px;
      padding: 0 2px;
      cursor: pointer;
      transition: color 140ms ease;
    }

    .vocab-point {
      color: var(--blue);
      background: transparent;
    }

    .grammar-point {
      color: var(--coral);
      background: transparent;
    }

    .vocab-point.active {
      background: transparent;
    }

    .grammar-point.active {
      background: transparent;
    }

    .salary-table {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 5px 28px;
      width: max-content;
      max-width: 100%;
      margin: 6px 0 0;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 620;
      line-height: 1.45;
    }

    .salary-line {
      display: contents;
    }

    .salary-time {
      grid-column: 1;
      white-space: nowrap;
    }

    .salary-price {
      grid-column: 2;
      color: var(--ink);
      font-weight: 620;
      white-space: nowrap;
    }

    .contact-info {
      margin-top: 8px;
      padding: 12px 0 0;
      border-top: 1px solid var(--line);
      color: #5c5f56;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.58;
    }

    .lesson-section-panel[hidden] {
      display: none;
    }

    .workspace:not(.is-text-section) .reader-head,
    .workspace:not(.is-text-section) .bottom-dock {
      display: none;
    }

    .resource-panel {
      background: #fff;
      color: var(--ink);
    }

    .resource-heading {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .resource-heading--with-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .resource-heading h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 720;
      line-height: 1.2;
    }

    .vocab-heading-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vocab-sort-control {
      position: relative;
      display: inline-flex;
      width: 128px;
      height: 34px;
      color: var(--sage-dark);
    }

    .vocab-sort-control .icon {
      position: absolute;
      z-index: 1;
      left: 11px;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translateY(-50%);
      stroke-width: 1.9;
      pointer-events: none;
    }

    .vocab-sort-control::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .vocab-sort-select {
      width: 100%;
      height: 100%;
      padding: 0 28px 0 32px;
      border: 1px solid rgba(138, 74, 64, 0.26);
      border-radius: 999px;
      appearance: none;
      background: #fff;
      color: var(--sage-dark);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .vocab-sort-control:hover .vocab-sort-select,
    .vocab-sort-control:focus-within .vocab-sort-select {
      border-color: rgba(138, 74, 64, 0.48);
      background: var(--sage-soft);
      outline: none;
      box-shadow: 0 4px 12px rgba(138, 74, 64, 0.08);
    }

    .vocab-self-check-toggle {
      min-width: 76px;
      height: 34px;
      padding: 0 16px;
      border: 1px solid rgba(138, 74, 64, 0.36);
      border-radius: 999px;
      background: #fff;
      color: var(--sage-dark);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .vocab-self-check-toggle:hover,
    .vocab-self-check-toggle:focus-visible,
    .vocab-self-check-toggle[aria-pressed="true"] {
      border-color: rgba(138, 74, 64, 0.56);
      background: var(--sage-soft);
      outline: none;
      box-shadow: 0 4px 12px rgba(138, 74, 64, 0.08);
    }

    .resource-list {
      display: grid;
      gap: 10px;
    }

    .lesson-vocab-bank .word-bank-entry-card,
    .lesson-pattern-bank .word-bank-entry-card {
      position: relative;
      display: grid;
      align-content: start;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .lesson-vocab-bank .word-bank-entry-head,
    .lesson-pattern-bank .word-bank-entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .lesson-vocab-bank .word-bank-entry-body,
    .lesson-pattern-bank .word-bank-entry-body {
      display: grid;
      align-content: start;
    }

    .lesson-vocab-bank .word-bank-entry-line,
    .lesson-pattern-bank .word-bank-entry-line {
      display: grid;
      min-width: 0;
    }

    .lesson-vocab-bank.word-bank-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .vocab-pos-group-heading {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      color: var(--sage-dark);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .vocab-pos-group-heading:first-child {
      margin-top: 0;
    }

    .vocab-pos-group-heading::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .lesson-vocab-bank .word-bank-entry-card {
      width: 100%;
      height: auto;
      min-height: 0;
      align-self: start;
      gap: 12px;
      padding: 18px 20px 20px;
      border-radius: 8px;
      background: #fff;
      box-shadow: none;
      text-align: left;
      cursor: default;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .lesson-vocab-bank .word-bank-entry-head {
      display: flex;
    }

    .lesson-vocab-bank .word-bank-entry-word {
      grid-column: auto;
    }

    .lesson-vocab-bank .word-bank-entry-actions {
      grid-column: auto;
    }

    .lesson-vocab-bank .word-bank-entry-card::before {
      left: 20px;
      right: 20px;
      top: 70px;
    }

    .lesson-vocab-bank .word-bank-entry-card.is-saved {
      border-color: rgba(138, 74, 64, 0.38);
    }

    .lesson-vocab-bank .word-bank-entry-card.is-saved::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 2px rgba(138, 74, 64, 0.07);
      pointer-events: none;
    }

    .lesson-vocab-bank .word-bank-entry-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      column-gap: 10px;
      row-gap: 4px;
      font-family: var(--sans);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .lesson-vocab-bank .vocab-word-title {
      min-width: 0;
      font-family: var(--sans);
      font-weight: 700;
      letter-spacing: 0;
    }

    .lesson-vocab-bank .vocab-word-meta {
      display: inline-flex;
      align-items: center;
      color: #7b8075;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .lesson-vocab-bank .word-bank-entry-word ruby {
      ruby-position: over;
    }

    .lesson-vocab-bank .word-bank-entry-word rt {
      font-size: 0.48em;
      font-weight: 560;
      letter-spacing: 0;
    }

    .lesson-vocab-bank .word-bank-entry-body,
    .lesson-pattern-bank .word-bank-entry-body {
      gap: 12px;
      padding-top: 12px;
    }

    .lesson-vocab-bank .word-bank-entry-line,
    .lesson-pattern-bank .word-bank-entry-line {
      min-height: 30px;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      color: #000;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .lesson-vocab-bank .word-bank-entry-line {
      align-items: start;
    }

    .lesson-vocab-bank .word-bank-entry-line strong,
    .lesson-pattern-bank .word-bank-entry-line strong {
      color: var(--sage-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .lesson-vocab-bank .word-bank-entry-line:has(.vocab-example-original) > strong {
      padding-top: 0.72em;
    }

    .lesson-vocab-bank .word-bank-entry-line span,
    .lesson-pattern-bank .word-bank-entry-line span {
      color: #000;
      font-family: var(--sans);
      font-weight: 400;
    }

    .lesson-vocab-bank .vocab-answer-content {
      display: inline;
      border-radius: 5px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      transition: filter 160ms ease, opacity 160ms ease, background 160ms ease;
    }

    .lesson-vocab-bank.is-self-check .vocab-answer-content {
      background: rgba(255, 255, 255, 0.68);
      filter: blur(5px);
      opacity: 0.45;
      pointer-events: none;
      user-select: none;
    }

    .lesson-vocab-bank .word-bank-entry-line .vocab-example-translation {
      display: block;
      margin-top: 5px;
      color: #0b7f75;
      font-size: 12px;
      line-height: 1.55;
    }

    .lesson-vocab-bank .vocab-example-original {
      display: block;
      line-height: 1.9;
    }

    .lesson-vocab-bank .vocab-example-original strong {
      color: #8b302a;
      font-weight: 750;
      text-decoration: underline;
      text-decoration-color: #8b302a;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    .lesson-vocab-bank .word-bank-entry-line ruby {
      ruby-position: over;
    }

    .lesson-vocab-bank .word-bank-entry-line rt {
      color: #6f7569;
      font-family: var(--sans);
      font-size: 0.58em;
      font-weight: 560;
      letter-spacing: 0;
    }

    .lesson-vocab-bank .word-bank-entry-line span *,
    .lesson-pattern-bank .word-bank-entry-line span * {
      font-family: var(--sans);
    }

    .lesson-vocab-bank .word-bank-entry-line span strong,
    .lesson-pattern-bank .word-bank-entry-line span strong {
      color: #000;
      font-family: var(--sans);
      font-size: inherit;
      font-weight: 700;
      letter-spacing: 0;
    }

    .grammar-detail-open *,
    .grammar-textbook-open * {
      font-family: var(--sans);
      font-weight: inherit;
    }

    .lesson-vocab-bank .word-bank-entry-actions {
      align-items: center;
      gap: 8px;
    }

    .vocab-pronounce-button {
      width: 28px;
      height: 28px;
      color: #7b8075;
      background: #fff;
    }

    .vocab-pronounce-button:hover,
    .vocab-pronounce-button:focus-visible,
    .vocab-pronounce-button.is-speaking {
      color: var(--sage-dark);
      border-color: rgba(138, 74, 64, 0.42);
      background: var(--sage-soft);
      outline: none;
    }

    .vocab-pronounce-button .icon {
      width: 14px;
      height: 14px;
      stroke-width: 1.9;
      pointer-events: none;

      <main class="reader" aria-label="Try! N2 教材学习主区域" tabindex="-1">
        <section class="reader-body" id="article-start">
          <article class="lesson-paper lesson-section-panel" data-section-panel="text" aria-label="课文正文"></article>

          <section class="resource-panel lesson-section-panel" data-section-panel="vocab" hidden aria-label="語彙">
            <div class="resource-heading resource-heading--with-actions">
              <h2>語彙</h2>
              <div class="vocab-heading-actions">
                <label class="vocab-sort-control" for="vocab-sort">
                  <svg class="icon" aria-hidden="true"><use href="#icon-list-filter"></use></svg>
                  <select class="vocab-sort-select" id="vocab-sort" aria-label="词汇排序方式">
                    <option value="lesson">课文顺序</option>
                    <option value="pos">按词性分类</option>
                  </select>
                </label>
                <button class="vocab-self-check-toggle" type="button" data-action="toggle-vocab-self-check" aria-pressed="false">自检</button>
              </div>
            </div>
            <div class="resource-list word-bank-list lesson-vocab-bank" id="vocab-list"></div>
          </section>

          <section class="resource-panel lesson-section-panel" data-section-panel="patterns" hidden aria-label="文型">
            <div class="resource-heading resource-heading--with-actions">
              <h2>文型</h2>
              <button class="pattern-practice-toggle" type="button" data-pattern-practice-toggle>练习一下</button>
            </div>
            <div class="resource-list word-bank-list lesson-pattern-bank" id="pattern-list"></div>
            <div class="pattern-practice-shell" id="pattern-practice-shell" hidden></div>
          </section>

          <section class="resource-panel lesson-section-panel" data-section-panel="practice" hidden aria-label="練習問題">
            <div class="resource-heading resource-heading--with-actions practice-heading">
              <h2>練習問題</h2>
              <button class="practice-mobile-reset" type="button" data-practice-reset>重新练习</button>
            </div>
            <div id="practice-content"></div>
          </section>
        </section>

        <footer class="bottom-dock" data-audio-dock hidden aria-label="课文音频播放器">
          <div class="audio-box" data-audio-player-view>
            <div class="audio-transport" aria-label="播放控制">
              <button class="audio-skip-button" type="button" data-audio-rewind aria-label="快退5秒" title="快退5秒">
                <svg class="icon" aria-hidden="true"><use href="#icon-skip-back"></use></svg>
                <span class="audio-skip-count" aria-hidden="true">5</span>
              </button>
              <button class="audio-play-button" type="button" data-audio-play aria-label="播放课文音频">
                <svg class="icon"><use href="#icon-play"></use></svg>
              </button>
              <button class="audio-skip-button" type="button" data-audio-forward aria-label="快进5秒" title="快进5秒">
                <svg class="icon" aria-hidden="true"><use href="#icon-skip-forward"></use></svg>
                <span class="audio-skip-count" aria-hidden="true">5</span>
              </button>
            </div>
            <div class="audio-meta">
              <div class="audio-label" data-audio-label>课文音频</div>
              <div class="audio-progress-row">
                <span data-audio-current>0:00</span>
                <button class="audio-track" type="button" role="slider" data-audio-track aria-label="调整播放进度" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 / 0:00">
                  <span class="audio-progress" data-audio-progress></span>
                </button>
                <span data-audio-duration>0:00</span>
              </div>
            </div>
            <button class="audio-part-button" type="button" data-audio-part hidden aria-label="切换课文篇章">上篇</button>
            <button class="audio-speed-button" type="button" data-audio-speed aria-label="切换播放速度">1×</button>
            <button class="audio-loop-button" type="button" data-audio-loop aria-pressed="false">
              <svg class="icon"><use href="#icon-refresh"></use></svg>
              <span>重复</span>
            </button>
            <audio data-lesson-audio preload="metadata"></audio>
          </div>
          <section class="shadowing-panel" data-shadowing-panel hidden aria-label="逐句跟读">
            <div class="shadowing-panel-head">
              <div class="shadowing-summary">
                <span class="shadowing-kicker">逐句跟读</span>
                <strong data-shadowing-progress>第 1 句</strong>
                <span class="shadowing-status" data-shadowing-status aria-live="polite">先听原音，再录下自己的跟读。</span>
              </div>
              <button class="shadowing-exit" type="button" data-action="toggle-shadowing">退出</button>
            </div>
            <div class="shadowing-controls">
              <button class="shadowing-icon-button" type="button" data-shadowing-prev aria-label="上一句" title="上一句">
                <svg class="icon"><use href="#icon-chevron-left"></use></svg>
              </button>
              <button class="shadowing-command" type="button" data-shadowing-original>
                <svg class="icon"><use href="#icon-play"></use></svg>
                <span>听原音</span>
              </button>
              <button class="shadowing-speed-button" type="button" data-shadowing-speed aria-label="切换跟读原音速度">1×</button>
              <button class="shadowing-command shadowing-record" type="button" data-shadowing-record aria-pressed="false">
                <svg class="icon"><use href="#icon-mic"></use></svg>
                <span>录音</span>
              </button>
              <button class="shadowing-command" type="button" data-shadowing-playback disabled>
                <svg class="icon"><use href="#icon-sound"></use></svg>
                <span>听我的</span>
              </button>
              <button class="shadowing-icon-button" type="button" data-shadowing-next aria-label="下一句" title="下一句">
                <svg class="icon"><use href="#icon-chevron-right"></use></svg>
              </button>
            </div>
            <audio data-shadowing-recording preload="metadata"></audio>
          </section>
        </footer>
      </main>
    </section>

    <div class="detail-popover" id="detail-popover" hidden role="tooltip" aria-live="polite">
      <p class="detail-summary" id="detail-summary"></p>
    </div>

    <div class="grammar-modal" id="grammar-modal" hidden>
      <div class="grammar-modal-panel" role="dialog" aria-modal="true" aria-label="文型详情">
        <div class="grammar-modal-head">
          <div>
            <h2 class="grammar-modal-title" id="grammar-modal-title"></h2>
            <div class="grammar-modal-badges" id="grammar-modal-badges"></div>
          </div>
          <button class="grammar-modal-close" type="button" data-action="close-grammar-detail" aria-label="关闭文型详情">&times;</button>
        </div>
        <button class="grammar-modal-standalone-close" type="button" data-action="close-grammar-detail" aria-label="关闭课文例句"><svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg></button>
        <div class="grammar-modal-body" id="grammar-modal-body"></div>
      </div>
    </div>
