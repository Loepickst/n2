            function questionDifficulty(verb, formId) {
                const formScores = {
                    masu: 0,
                    te: 1,
                    ta: 1,
                    nai: 1,
                    pot: 2,
                    vol: 1,
                    pas: 2,
                    cau: 3,
                    cpas: 5,
                    imp: 2
                };
                let score = formScores[formId] ?? 1;
                const specialKind = ['vk', 'vs-i', 'vs-s', 'v1-s', 'v5aru', 'v5k-s', 'v5r-i', 'v5u-s'].includes(verb.kind);
                if (specialKind) score += 2;
                if (Array.from(verb.word).length >= 6) score += 1;
                if (verb.kind === 'v5r' && verb.reading.endsWith('る')) {
                    const previousKana = Array.from(verb.reading).at(-2) || '';
                    if ('いきぎしじちにひびぴみりえけげせぜてでねへべぺめれ'.includes(previousKana)) score += 2;
                }
                if (score >= 5) return 'hard';
                if (score >= 3) return 'medium';
                return 'basic';
            }

            function buildQuestionPool() {
                const pool = [];
                verbs.forEach((verb, verbIndex) => {
                    if (!matchesSelectedVocabularyFilter(verb)) return;
                    state.selectedForms.forEach((formId) => {
                        const form = verb.forms?.[formId];
                        if (!form || acceptedAnswers(form).length === 0) return;
                        pool.push({
                            verbIndex,
                            formId,
                            key: adaptiveQuestionKey(verb, formId),
                            difficulty: questionDifficulty(verb, formId)
                        });
                    });
                });
                return pool;
            }

            function shuffledQuestions(items) {
                const shuffled = items.map((item) => ({ ...item, source: 'random' }));
                for (let index = shuffled.length - 1; index > 0; index -= 1) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
                }
                return shuffled;
            }

            function randomInteger(minimum, maximum) {
                return minimum + Math.floor(Math.random() * ((maximum - minimum) + 1));
            }

            function scheduleAdaptiveReview(item, minimumDelay, maximumDelay, reason) {
                if (!item?.key) return;
                const dueAt = state.questionSerial + randomInteger(minimumDelay, maximumDelay);
                const existing = state.deferredReviews.find((review) => review.item.key === item.key);
                if (existing) {
                    existing.dueAt = Math.min(existing.dueAt, dueAt);
                    existing.reason = reason;
                    return;
                }
                state.deferredReviews.push({
                    item: {
                        verbIndex: item.verbIndex,
                        formId: item.formId,
                        key: item.key,
                        difficulty: item.difficulty
                    },
                    dueAt,
                    reason
                });
            }

            function availableDifficultyTargets() {
                const available = new Set(state.questionPool.map((item) => item.difficulty));
                const total = Object.entries(difficultyTargets)
                    .filter(([difficulty]) => available.has(difficulty))
                    .reduce((sum, [, target]) => sum + target, 0) || 1;
                return Object.fromEntries(Object.entries(difficultyTargets)
                    .filter(([difficulty]) => available.has(difficulty))
                    .map(([difficulty, target]) => [difficulty, target / total]));
            }

            function chooseDifficulty() {
                const targets = availableDifficultyTargets();
                const nextOrdinal = state.questionSerial + 1;
                return Object.keys(targets)
                    .map((difficulty) => ({
                        difficulty,
                        deficit: (targets[difficulty] * nextOrdinal)
                            - state.difficultyCounts[difficulty]
                            + (Math.random() * 0.22)
                    }))
                    .sort((left, right) => right.deficit - left.deficit)[0]?.difficulty || 'basic';
            }

            function avoidsRecentQuestions(item, strict = true) {
                const verbWindow = strict ? 5 : 2;
                const questionWindow = strict ? 9 : 3;
                if (state.recentVerbIndexes.slice(-verbWindow).includes(item.verbIndex)) return false;
                if (state.recentQuestionKeys.slice(-questionWindow).includes(item.key)) return false;
                if (strict
                    && state.recentFormIds.length >= 2
                    && state.recentFormIds.at(-1) === item.formId
                    && state.recentFormIds.at(-2) === item.formId) return false;
                return true;
            }

            function formWeaknessScores() {
                const totals = Object.fromEntries(formIds.map((formId) => [formId, { score: 0, records: 0 }]));
                Object.values(adaptiveHistory).forEach((stats) => {
                    if (!totals[stats.formId]) return;
                    const attempts = Math.max(1, Number(stats.seen) || 0);
                    const mistakes = ((Number(stats.wrong) || 0) * 2)
                        + ((Number(stats.skips) || 0) * 1.5)
                        + (Number(stats.hints) || 0)
                        + ((Number(stats.slow) || 0) * 0.75);
                    totals[stats.formId].score += (mistakes / attempts) + Math.max(0, (Number(stats.priority) || 1) - 1);
                    totals[stats.formId].records += 1;
                });
                return Object.fromEntries(Object.entries(totals).map(([formId, total]) => [
                    formId,
                    total.records ? total.score / total.records : 0
                ]));
            }

            function chooseQuestionSource() {
                const roll = Math.random();
                let cursor = 0;
                for (const [source, target] of questionSourceTargets) {
                    cursor += target;
                    if (roll <= cursor) return source;
                }
                return 'normal';
            }

            function candidatesForSource(candidates, source) {
                if (source === 'unseen') {
                    return candidates.filter((item) => !(adaptiveStatsFor(item)?.seen > 0));
                }
                if (source === 'review') {
                    return candidates.filter((item) => (adaptiveStatsFor(item)?.priority || 0) >= 1.75);
                }
                if (source === 'weak') {
                    const weakness = formWeaknessScores();
                    const rankedForms = [...state.selectedForms]
                        .filter((formId) => weakness[formId] > 0)
                        .sort((left, right) => weakness[right] - weakness[left]);
                    const weakForms = new Set(rankedForms.slice(0, Math.max(1, Math.ceil(rankedForms.length / 3))));
                    return weakForms.size ? candidates.filter((item) => weakForms.has(item.formId)) : [];
                }
                return candidates;
            }

            function weightedQuestionChoice(candidates) {
                const weighted = candidates.map((item) => {
                    const stats = adaptiveStatsFor(item);
                    let weight = stats ? Math.max(0.35, Math.min(5, Number(stats.priority) || 1)) : 1.2;
                    if (stats?.consecutiveCorrect >= 3) weight *= 0.72;
                    if (stats?.lastSeen && Date.now() - stats.lastSeen < 5 * 60 * 1000) weight *= 0.78;
                    return { item, weight };
                });
                const totalWeight = weighted.reduce((sum, entry) => sum + entry.weight, 0);
                let cursor = Math.random() * totalWeight;
                for (const entry of weighted) {
                    cursor -= entry.weight;
                    if (cursor <= 0) return entry.item;
                }
                return weighted.at(-1)?.item || null;
            }

            function recordQuestionSelection(item) {
                state.questionSerial += 1;
                state.difficultyCounts[item.difficulty] += 1;
                state.recentVerbIndexes.push(item.verbIndex);
                state.recentFormIds.push(item.formId);
                state.recentQuestionKeys.push(item.key);
                state.recentVerbIndexes = state.recentVerbIndexes.slice(-8);
                state.recentFormIds = state.recentFormIds.slice(-5);
                state.recentQuestionKeys = state.recentQuestionKeys.slice(-12);
            }

            function selectNextQuestion() {
                if (!state.questionPool.length) return null;
                const difficulty = chooseDifficulty();
                const sameDifficulty = state.questionPool.filter((item) => item.difficulty === difficulty);
                const dueReview = state.deferredReviews
                    .filter((review) => review.dueAt <= state.questionSerial
                        && review.item.difficulty === difficulty
                        && !state.recentQuestionKeys.slice(-2).includes(review.item.key))
                    .sort((left, right) => left.dueAt - right.dueAt)[0];

                if (dueReview) {
                    const selectedReview = sameDifficulty.find((item) => item.key === dueReview.item.key);
                    if (selectedReview) {
                        state.deferredReviews = state.deferredReviews.filter((review) => review !== dueReview);
                        const result = { ...selectedReview, source: `deferred-${dueReview.reason}` };
                        recordQuestionSelection(result);
                        return result;
                    }
                }

                let eligible = sameDifficulty.filter((item) => avoidsRecentQuestions(item, true));
                if (!eligible.length) eligible = sameDifficulty.filter((item) => avoidsRecentQuestions(item, false));
                if (!eligible.length) eligible = sameDifficulty;

                let selected;
                let source = 'normal';
                source = chooseQuestionSource();
                const sourceCandidates = candidatesForSource(eligible, source);
                if (source !== 'normal' && sourceCandidates.length === 0) source = 'normal';
                selected = weightedQuestionChoice(sourceCandidates.length ? sourceCandidates : eligible);

                if (!selected) selected = state.questionPool[Math.floor(Math.random() * state.questionPool.length)];
                const result = { ...selected, source };
                recordQuestionSelection(result);
                return result;
            }

            function currentQuestion() {
                const item = state.queue[state.index];
                if (!item) return null;
                const verb = verbs[item.verbIndex];
                return { ...item, verb, form: verb.forms[item.formId] };
            }

            function hintFor(verb, formId) {
                const type = normalizeType(verb.basic.type);
                if (type === '不规则') return '不规则动词需要单独记忆这一形态。';
                const rules = {
                    masu: type === '五段' ? '把最后一个假名移到「い段」，再接「ます」。' : '去掉词尾「る」，再接「ます」。',
                    te: type === '五段' ? '注意五段动词的促音、拨音或イ音变化。' : '去掉词尾「る」，再接「て」。',
                    ta: type === '五段' ? '变化方式与「て形」相同，再把「て／で」换成「た／だ」。' : '去掉词尾「る」，再接「た」。',
                    nai: type === '五段' ? '把最后一个假名移到「あ段」，再接「ない」。' : '去掉词尾「る」，再接「ない」。',
                    pot: type === '五段' ? '把最后一个假名移到「え段」，再接「る」。' : '去掉词尾「る」，再接「られる」。',
                    vol: type === '五段' ? '把最后一个假名移到「お段」，再接「う」。' : '去掉词尾「る」，再接「よう」。',
                    pas: type === '五段' ? '把最后一个假名移到「あ段」，再接「れる」。' : '去掉词尾「る」，再接「られる」。',
                    cau: type === '五段' ? '把最后一个假名移到「あ段」，再接「せる」。' : '去掉词尾「る」，再接「させる」。',
                    cpas: type === '五段' ? '先变为使役形，再接「られる」。' : '去掉词尾「る」，再接「させられる」。',
                    imp: type === '五段' ? '把最后一个假名移到「え段」。' : '去掉词尾「る」，再接「ろ」。'
                };
                return rules[formId] || '先判断动词类别，再改变词尾。';
            }

            function setView(view) {
                state.view = view;
                document.querySelectorAll('[data-game-view]').forEach((section) => {
                    const active = section.dataset.gameView === view;
                    section.hidden = !active;
                });
                document.body.dataset.view = view;
                if (view !== 'practice') clearKeyboardLayout();
            }

            function isMobilePracticeLayout() {
                return window.matchMedia('(max-width: 760px)').matches;
            }

            function lockPracticeViewport() {
                if (!isMobilePracticeLayout()) return;
                const visualHeight = window.visualViewport?.height || 0;
                const height = Math.max(window.innerHeight, document.documentElement.clientHeight, visualHeight);
                state.practiceViewportHeight = Math.round(height);
                state.questionRestingCenter = 0;
                state.keyboardOpen = false;
                const practice = document.querySelector('[data-game-view="practice"]');
                practice.style.setProperty('--practice-height', `${state.practiceViewportHeight}px`);
                practice.style.setProperty('--keyboard-top', `${state.practiceViewportHeight}px`);
                practice.style.setProperty('--keyboard-viewport-top', '0px');
                practice.style.setProperty('--keyboard-visible-height', `${state.practiceViewportHeight}px`);
                document.body.classList.remove('is-keyboard-open', 'is-keyboard-compact');
            }

            function clearKeyboardLayout() {
                if (state.keyboardSyncTimerId) window.clearTimeout(state.keyboardSyncTimerId);
                state.keyboardSyncTimerId = 0;
                state.keyboardOpen = false;
                document.body.classList.remove('is-keyboard-open', 'is-keyboard-compact');
            }

            function syncKeyboardLayout() {
                state.keyboardSyncTimerId = 0;
                if (usesBuiltInRomajiKeyboard()) {
                    clearKeyboardLayout();
                    return;
                }
                if (!isMobilePracticeLayout() || state.view !== 'practice') {
                    clearKeyboardLayout();
                    return;
                }

                const input = $('answerInput');
                const viewport = window.visualViewport;
                const visibleHeight = Math.round(viewport?.height || window.innerHeight);
                const viewportTop = Math.round(viewport?.offsetTop || 0);
                const occludedHeight = Math.max(0, state.practiceViewportHeight - visibleHeight);
                const threshold = state.keyboardOpen ? 72 : 120;
                const shouldOpen = document.activeElement === input && occludedHeight > threshold;

                const questionShell = document.querySelector('.question-shell');
                if (!state.questionRestingCenter) {
                    const questionRect = questionShell.getBoundingClientRect();
                    if (questionRect.height) {
                        state.questionRestingCenter = questionRect.top + (questionRect.height / 2);
                    }
                }

                state.keyboardOpen = shouldOpen;
                document.body.classList.toggle('is-keyboard-open', shouldOpen);
                const compact = shouldOpen && visibleHeight < 420;
                document.body.classList.toggle('is-keyboard-compact', compact);
                if (shouldOpen) {
                    const keyboardTop = viewportTop + visibleHeight;
                    const shellHeight = compact ? 218 : 302;
                    const controlsTop = keyboardTop - 63;
                    const minimumTop = viewportTop + (compact ? 60 : 48);
                    const desiredTop = Math.max(minimumTop, controlsTop - shellHeight - 10);
                    const restingTop = state.questionRestingCenter - (shellHeight / 2);
                    const shift = Math.min(0, Math.round(desiredTop - restingTop));
                    const practice = document.querySelector('[data-game-view="practice"]');
                    practice.style.setProperty('--keyboard-top', `${keyboardTop}px`);
                    practice.style.setProperty('--keyboard-viewport-top', `${viewportTop}px`);
                    practice.style.setProperty('--keyboard-visible-height', `${visibleHeight}px`);
                    practice.style.setProperty('--keyboard-shift', `${shift}px`);
                }
            }

            function scheduleKeyboardSync(delay = 90) {
                if (state.keyboardSyncTimerId) window.clearTimeout(state.keyboardSyncTimerId);
                state.keyboardSyncTimerId = window.setTimeout(syncKeyboardLayout, delay);
            }

            function updateStreak() {
                $('streak').textContent = String(state.streak);
                $('streakWrap').classList.toggle('is-live', state.streak > 0);
            }

            function updateScore() {
                $('score').textContent = String(state.score);
            }

            function clearBrushFeedback() {
                if (state.feedbackTimerId) window.clearTimeout(state.feedbackTimerId);
                state.feedbackTimerId = 0;
                $('brushFeedback').className = 'brush-feedback';
                $('inkParticles').replaceChildren();
                document.querySelector('[data-game-view="practice"]').classList.remove('is-brush-hit');
                $('scoreWrap').classList.remove('is-punch');
                $('streakWrap').classList.remove('is-punch');
            }

            function clearAdvanceTimer() {
                if (state.advanceTimerId) window.clearTimeout(state.advanceTimerId);
                state.advanceTimerId = 0;
            }

            function brushEffectTier(streak) {
                if (streak >= 10) return 4;
                if (streak >= 7) return 3;
                if (streak >= 4) return 2;
                return 1;
            }

            function showBrushFeedback(streak, awarded) {
                clearBrushFeedback();
                const layer = $('brushFeedback');
                const particles = $('inkParticles');
                const tier = brushEffectTier(streak);
                const particleCount = Math.min(12 + (tier * 4) + Math.floor(streak / 2), 34);
                const fragment = document.createDocumentFragment();

                $('brushCombo').textContent = String(streak);
                $('brushPoints').textContent = `+${awarded} 点`;
                for (let index = 0; index < particleCount; index += 1) {
                    const drop = document.createElement('i');
                    const angle = ((360 / particleCount) * index) + ((index % 3) - 1) * 5;
                    const distance = 88 + (index % 6) * 18 + tier * 13;
                    const size = 4 + (index % 4) * 1.7;
                    drop.className = `ink-drop${index % 5 === 0 ? ' is-vermilion' : ''}${index % 3 === 0 ? ' is-round' : ''}`;
                    drop.style.setProperty('--ink-angle', `${angle}deg`);
                    drop.style.setProperty('--ink-distance', `${distance}px`);
                    drop.style.setProperty('--ink-size', `${size}px`);
                    drop.style.setProperty('--ink-delay', `${(index % 5) * 13}ms`);
                    fragment.appendChild(drop);
                }
                particles.appendChild(fragment);

                layer.classList.add(`tier-${tier}`);
                void layer.offsetWidth;
                document.querySelector('[data-game-view="practice"]').classList.add('is-brush-hit');
                layer.classList.add('is-active');
                $('scoreWrap').classList.add('is-punch');
                $('streakWrap').classList.add('is-punch');
                state.feedbackTimerId = window.setTimeout(clearBrushFeedback, 1100);
            }

            function updateHints() {
                $('hintRemaining').textContent = String(state.hintsRemaining);
                $('hintButton').setAttribute('aria-label', `ヒント、残り ${state.hintsRemaining} 回`);
                if (state.hintsRemaining <= 0) $('hintButton').disabled = true;
            }

            function updateSkips() {
                $('skipRemaining').textContent = String(state.skipsRemaining);
                $('skipButton').setAttribute('aria-label', `スキップ、残り ${state.skipsRemaining} 回`);
                if (state.skipsRemaining <= 0) $('skipButton').disabled = true;
            }

            function clearTimer() {
                if (state.timerId) window.clearInterval(state.timerId);
                state.timerId = 0;
            }

            function clearCountdown() {
                if (state.countdownTimerId) {
                    window.clearInterval(state.countdownTimerId);
                    window.clearTimeout(state.countdownTimerId);
                }
                state.countdownTimerId = 0;
            }

            function clearEndingTransition() {
                if (state.endingTimerId) window.clearTimeout(state.endingTimerId);
                state.endingTimerId = 0;
                $('endingStage').classList.remove('is-active');
            }

            function clearResultPresentation() {
                clearNewRecordEffect();
                $('resultView').classList.remove('is-unfurling');
            }

            function updateTimer() {
                if (state.view !== 'practice') return;
                const remainingMs = Math.max(0, state.endsAt - Date.now());
                state.remainingSeconds = remainingMs / 1000;
                $('timeLeft').textContent = state.remainingSeconds.toFixed(1);
                $('timer').classList.toggle('is-urgent', state.remainingSeconds <= 10);
                if (remainingMs <= 0) finishGame();
            }

            function startTimer() {
                clearTimer();
                state.endsAt = Date.now() + roundDurationMs;
                state.remainingSeconds = roundDurationMs / 1000;
                updateTimer();
                state.timerId = window.setInterval(updateTimer, 100);
            }

            function renderQuestion() {
                const question = currentQuestion();
                if (!question) return;

                clearAdvanceTimer();
                clearBrushFeedback();
                state.answered = false;
                state.currentHintUsed = false;
                $('verbType').textContent = normalizeType(question.verb.basic.type);
                $('targetForm').textContent = formLabels[question.formId];
                $('verbWord').innerHTML = question.verb.basic.show;
                $('verbWord').dataset.level = vocabularyLevelForVerb(question.verb);
                $('verbWord').dataset.difficulty = question.difficulty;
                $('verbWord').dataset.questionSource = question.source;
                const wordLength = Array.from(question.verb.word).length;
                $('verbWord').classList.toggle('is-long', wordLength >= 6 && wordLength < 8);
                $('verbWord').classList.toggle('is-very-long', wordLength >= 8);
                $('hintText').textContent = '';
                $('hintText').hidden = true;
                $('feedback').textContent = '';
                $('feedback').className = 'feedback';
                $('hintButton').disabled = state.hintsRemaining <= 0;
                $('skipButton').disabled = state.skipsRemaining <= 0;
                updateHints();
                updateSkips();

                const input = $('answerInput');
                const builtInRomaji = usesBuiltInRomajiKeyboard();
                input.setAttribute('aria-label', builtInRomaji
                    ? `${formLabels[question.formId]}をローマ字で入力`
                    : `${formLabels[question.formId]}をひらがなで入力`);
                input.disabled = false;
                input.classList.remove('is-correct', 'is-wrong', 'is-locked');
                configureAnswerInput();
                resetRomajiAnswer();
                $('romajiKeyboard').classList.remove('is-disabled');
                $('answerSubmit').textContent = '判定';
                $('answerSubmit').disabled = true;
                state.questionStartedAt = Date.now();
                requestAnimationFrame(() => {
                    input.focus({ preventScroll: true });
                    scheduleKeyboardSync(120);
                });
            }

            function checkAnswer() {
                if (state.answered) return;
                const input = $('answerInput');
                if (usesBuiltInRomajiKeyboard()) commitRomajiBuffer(true);
                const userAnswer = input.value.trim();
                if (!userAnswer) return;

                const question = currentQuestion();
                const item = state.queue[state.index];
                const answers = acceptedAnswers(question.form);
                const correct = answers.includes(userAnswer);
                const elapsedMs = Math.max(0, Date.now() - state.questionStartedAt);
                let awarded = 0;
                state.answered = true;
                input.classList.add('is-locked');
                input.setAttribute('aria-readonly', 'true');
                $('hintButton').disabled = true;
                $('skipButton').disabled = true;
                $('romajiKeyboard').classList.add('is-disabled');

                if (correct) {
                    if (state.questionMode === 'study') updateAdaptiveStats(item, 'correct', elapsedMs);
                    state.streak += 1;
                    const streakBonus = Math.min((state.streak - 1) * streakStep, maxStreakBonus);
                    const elapsedSeconds = Math.floor(elapsedMs / 1000);
                    const bonusSeconds = Math.max(0, timeBonusWindowSeconds - elapsedSeconds);
                    const timeBonus = bonusSeconds * timeBonusPerSecond;
                    awarded = baseScore + streakBonus + timeBonus;
                    state.score += awarded;
                    input.classList.add('is-correct');
                    $('feedback').textContent = `正解  +${awarded} · ${state.streak} 連撃`;
                    $('feedback').classList.add('is-correct');
                } else {
                    if (state.questionMode === 'study') {
                        updateAdaptiveStats(item, 'wrong', elapsedMs);
                        scheduleAdaptiveReview(item, 3, 6, 'wrong');
                    }
                    state.streak = 0;
                    clearBrushFeedback();
                    input.classList.add('is-wrong');
                    $('feedback').textContent = `正答：${answers.join('／')}`;
                    $('feedback').classList.add('is-wrong');
                }

                updateStreak();
                updateScore();
                const submit = $('answerSubmit');
                if (correct) {
                    showBrushFeedback(state.streak, awarded);
                    submit.textContent = '次へ…';
                    submit.disabled = true;
                    const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches
                        ? 350
                        : correctAdvanceDelayMs;
                    state.advanceTimerId = window.setTimeout(() => {
                        state.advanceTimerId = 0;
                        if (state.view === 'practice' && state.answered) advanceQuestion();
                    }, delay);
                } else {
                    submit.textContent = '次の問';
                    submit.disabled = false;
                    input.focus({ preventScroll: true });
                }
            }

            function advanceQuestion() {
                state.index += 1;
                if (state.index >= state.queue.length) {
                    if (state.questionMode === 'random') {
                        state.queue = shuffledQuestions(state.questionPool);
                        state.index = 0;
                    } else {
                        const nextQuestion = selectNextQuestion();
                        if (!nextQuestion) {
                            finishGame();
                            return;
                        }
                        state.queue.push(nextQuestion);
                    }
                }
                renderQuestion();
            }

            function showHint() {
                if (state.answered || state.hintsRemaining <= 0) return;
                const question = currentQuestion();
                if (!question) return;
                const item = state.queue[state.index];
                state.hintsRemaining -= 1;
                state.currentHintUsed = true;
                if (state.questionMode === 'study') {
                    updateAdaptiveStats(item, 'hint');
                    scheduleAdaptiveReview(item, 5, 8, 'hint');
                }
                $('hintText').textContent = hintFor(question.verb, question.formId);
                $('hintText').hidden = false;
                updateHints();
                $('hintButton').disabled = true;
                $('answerInput').focus({ preventScroll: true });
            }

            function skipQuestion() {
                if (state.view !== 'practice' || state.answered || state.skipsRemaining <= 0) return;
                const item = state.queue[state.index];
                state.skipsRemaining -= 1;
                if (state.questionMode === 'study') {
                    updateAdaptiveStats(item, 'skip');
                    scheduleAdaptiveReview(item, 2, 4, 'skip');
                }
                updateSkips();
                advanceQuestion();
            }

            function beginGame() {
                clearCountdown();
                lockPracticeViewport();
                state.questionPool = buildQuestionPool();
                state.queue = [];
                state.index = 0;
                state.questionSerial = 0;
                state.deferredReviews = [];
                state.recentVerbIndexes = [];
                state.recentFormIds = [];
                state.recentQuestionKeys = [];
                state.difficultyCounts = { basic: 0, medium: 0, hard: 0 };
                if (state.questionMode === 'random') state.queue = shuffledQuestions(state.questionPool);
                const firstQuestion = state.questionMode === 'random'
                    ? state.queue[0]
                    : selectNextQuestion();
                if (!firstQuestion) {
                    setView('home');
                    return;
                }
                if (state.questionMode === 'study') state.queue.push(firstQuestion);
                state.streak = 0;
                state.score = 0;
                state.hintsRemaining = maxHints;
                state.skipsRemaining = maxSkips;
                state.remainingSeconds = 120;
                updateStreak();
                updateScore();
                updateHints();
                updateSkips();
                setView('practice');
                renderQuestion();
                startTimer();
            }

            function showCountdownValue(value, isStart = false) {
                const number = $('countdownNumber');
                number.classList.remove('is-pop', 'is-start');
                number.textContent = value;
                number.classList.toggle('is-start', isStart);
                void number.offsetWidth;
                number.classList.add('is-pop');
            }

            function startCountdown() {
                clearTimer();
                clearCountdown();
                clearAdvanceTimer();
                clearEndingTransition();
                clearResultPresentation();
                setView('countdown');
                $('countdownReady').textContent = 'よーい';
                showCountdownValue('3');

                let count = 3;
                state.countdownTimerId = window.setInterval(() => {
                    count -= 1;
                    if (count > 0) {
                        showCountdownValue(String(count));
                        return;
                    }

                    window.clearInterval(state.countdownTimerId);
                    $('countdownReady').textContent = '';
                    showCountdownValue('はじめ！', true);
                    state.countdownTimerId = window.setTimeout(beginGame, 560);
                }, 1000);
            }

            function showResult(isNewBest) {
                clearEndingTransition();
                clearResultPresentation();
                $('resultEyebrow').textContent = isNewBest ? '自己最高を更新' : '百二十秒の稽古';
                $('resultTitle').textContent = isNewBest ? '新記録' : '稽古終了';

                const resultView = $('resultView');
                setView('result');
                void resultView.offsetWidth;
                resultView.classList.add('is-unfurling');

                if (isNewBest && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    state.recordTimerId = window.setTimeout(() => playNewRecordEffect(true), 1200);
                }
            }

            function playEndingTransition(isNewBest) {
                clearEndingTransition();
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    showResult(isNewBest);
                    return;
                }

                setView('ending');
                const stage = $('endingStage');
                void stage.offsetWidth;
                stage.classList.add('is-active');
                state.endingTimerId = window.setTimeout(() => showResult(isNewBest), 920);
            }

            function finishGame() {
                if (state.view !== 'practice') return;
                clearTimer();
                clearAdvanceTimer();
                clearBrushFeedback();
                $('answerInput').disabled = true;
                $('answerInput').blur();
                $('answerSubmit').disabled = true;
                $('hintButton').disabled = true;
                $('skipButton').disabled = true;
                $('romajiKeyboard').classList.add('is-disabled');
                $('resultScore').textContent = String(state.score);
                const previousBest = loadBestScore();
                const isNewBest = state.score > previousBest;
                const bestScore = isNewBest ? saveBestScore(state.score) : previousBest;
                renderBestScore(bestScore, isNewBest);
                playEndingTransition(isNewBest);
            }

            function returnHome() {
                clearTimer();
                clearCountdown();
                clearAdvanceTimer();
                clearBrushFeedback();
                clearEndingTransition();
                clearResultPresentation();
                clearKeyboardLayout();
                $('answerInput').blur();
                renderBestScore(loadBestScore(), false);
                setView('home');
            }

            $('startButton').addEventListener('click', startCountdown);
            $('exitButton').addEventListener('click', returnHome);
            $('hintButton').addEventListener('click', showHint);
            $('skipButton').addEventListener('click', skipQuestion);
            $('againButton').addEventListener('click', startCountdown);
            $('homeButton').addEventListener('click', returnHome);
            $('settingsButton').addEventListener('click', openSettings);
            $('settingsCloseButton').addEventListener('click', closeSettings);
            $('settingsResetButton').addEventListener('click', () => {
                document.querySelectorAll('#settingsForm input[type="checkbox"]').forEach((input) => {
                    input.checked = true;
                });
                $('settingsError').textContent = '';
            });
            $('settingsForm').addEventListener('submit', applySettings);
            $('settingsForm').addEventListener('change', () => {
                $('settingsError').textContent = '';
            });

            $('romajiKeyboard').addEventListener('pointerdown', (event) => {
                if (event.target.closest('.romaji-key')) event.preventDefault();
            });
            $('romajiKeyboard').addEventListener('click', (event) => {
                const keyButton = event.target.closest('.romaji-key');
                if (!keyButton) return;
                if (keyButton.dataset.romajiAction === 'backspace') deleteRomajiCharacter();
                else if (keyButton.dataset.romajiAction === 'shift') {
                    const keyboard = $('romajiKeyboard');
                    const shifted = keyboard.classList.toggle('is-shifted');
                    keyButton.classList.toggle('is-shift-active', shifted);
                    keyboard.querySelectorAll('.romaji-key[data-romaji-key]').forEach((key) => {
                        if (/^[a-z]$/.test(key.dataset.romajiKey)) {
                            key.textContent = shifted ? key.dataset.romajiKey.toUpperCase() : key.dataset.romajiKey;
                        }
                    });
                } else if (keyButton.dataset.romajiKey) {
                    enterRomajiKey(keyButton.dataset.romajiKey);
                    const keyboard = $('romajiKeyboard');
                    if (keyboard.classList.contains('is-shifted')) {
                        keyboard.classList.remove('is-shifted');
                        keyboard.querySelector('[data-romaji-action="shift"]')?.classList.remove('is-shift-active');
                        keyboard.querySelectorAll('.romaji-key[data-romaji-key]').forEach((key) => {
                            if (/^[a-z]$/.test(key.dataset.romajiKey)) key.textContent = key.dataset.romajiKey;
                        });
                    }
                }
                $('answerInput').focus({ preventScroll: true });
            });

            const input = $('answerInput');
            const preserveKeyboardFocus = (event) => {
                if (isMobilePracticeLayout() && document.activeElement === input) event.preventDefault();
            };
            $('answerSubmit').addEventListener('pointerdown', preserveKeyboardFocus);
            $('hintButton').addEventListener('pointerdown', preserveKeyboardFocus);
            $('skipButton').addEventListener('pointerdown', preserveKeyboardFocus);
            input.addEventListener('compositionstart', () => { state.composing = true; });
            input.addEventListener('compositionend', () => { state.composing = false; });
            input.addEventListener('beforeinput', (event) => {
                if (state.answered) event.preventDefault();
            });
            input.addEventListener('focus', () => scheduleKeyboardSync(120));
            input.addEventListener('blur', () => scheduleKeyboardSync(80));
            input.addEventListener('input', () => {
                if (!state.answered) $('answerSubmit').disabled = !input.value.trim();
            });
            input.addEventListener('keydown', (event) => {
                if (state.composing || event.isComposing || event.keyCode === 229) return;
                if (event.ctrlKey || event.metaKey || event.altKey) return;
                if (/^[a-zA-Z]$/.test(event.key)) {
                    event.preventDefault();
                    enterRomajiKey(event.key.toLowerCase());
                    return;
                }
                if (event.key === '-' || event.key === "'" || event.key === 'ー') {
                    event.preventDefault();
                    enterRomajiKey(event.key === 'ー' ? '-' : event.key);
                    return;
                }
                if (event.key === 'Backspace' || event.key === 'Delete') {
                    event.preventDefault();
                    deleteRomajiCharacter();
                    return;
                }
                if (event.key !== 'Enter') return;
                event.preventDefault();
                if (state.answered) {
                    if (!state.advanceTimerId) advanceQuestion();
                } else {
                    checkAnswer();
                }
            });
            $('answerForm').addEventListener('submit', (event) => {
                event.preventDefault();
                if (state.composing || event.isComposing) return;
                if (state.answered) advanceQuestion();
                else checkAnswer();
            });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => scheduleKeyboardSync());
                window.visualViewport.addEventListener('scroll', () => scheduleKeyboardSync());
            }
            window.addEventListener('resize', () => {
                configureAnswerInput();
                scheduleKeyboardSync();
            });
            window.addEventListener('orientationchange', () => {
                clearKeyboardLayout();
                window.setTimeout(() => {
                    configureAnswerInput();
                    if (state.view === 'practice') {
                        lockPracticeViewport();
                        scheduleKeyboardSync(120);
                    }
                }, 320);
            });

            adaptiveHistory = loadAdaptiveHistory();
            loadPracticeSettings();
            updateLevelCounts();
            syncSettingsControls();
            renderBestScore();
            configureAnswerInput();
            setView('home');
        })();
    </script>
</body>
</html>
