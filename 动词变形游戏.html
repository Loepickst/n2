<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3eb">
    <meta name="description" content="独立的日语动词变形填空练习游戏。">
    <title>活用道場｜動詞変形の稽古</title>
    <style>
        :root {
            --paper: #f6f3eb;
            --paper-light: #fcfaf5;
            --ink: #1c1d1a;
            --muted: #6d6c66;
            --line: rgba(28, 29, 26, 0.16);
            --red: #a34336;
            --red-dark: #7f3027;
            --gold: #b48a32;
            --wood: #56392e;
            --wood-dark: #281b16;
            --wood-light: #806052;
            --tatami: #b7aa77;
            --tatami-dark: #8b805c;
            --shoji: #efe8da;
            --green: #4d7255;
            --error: #a7463b;
            --display: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "Songti SC", serif;
            --cn: "Heiti SC", SimHei, "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --jp-ui: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
            --ui: var(--cn);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: var(--cn);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        :lang(ja) {
            font-family: var(--jp-ui);
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        body[data-view="countdown"],
        body[data-view="practice"],
        body[data-view="ending"],
        body[data-view="result"] {
            overflow: hidden;
        }

        .view {
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Home — restrained Japanese dojo */
        .home-view {
            position: relative;
            display: grid;
            place-items: center;
            padding: clamp(42px, 6vw, 82px) clamp(28px, 6vw, 86px) clamp(80px, 9vw, 120px);
            overflow: hidden;
            background:
                linear-gradient(90deg, var(--wood-dark) 0 16px, transparent 16px calc(100% - 16px), var(--wood-dark) calc(100% - 16px)),
                repeating-linear-gradient(90deg, transparent 0 116px, rgba(86, 57, 46, 0.14) 117px 122px),
                repeating-linear-gradient(0deg, transparent 0 103px, rgba(86, 57, 46, 0.12) 104px 109px),
                var(--shoji);
        }

        .home-view::before {
            position: absolute;
            inset: 0 0 auto;
            z-index: 2;
            height: 19px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.2);
            content: '';
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 42%),
                linear-gradient(90deg, var(--wood-dark), var(--wood-light) 24% 76%, var(--wood-dark));
            box-shadow: 0 5px 16px rgba(40, 27, 22, 0.18);
        }

        .home-view::after {
            position: absolute;
            inset: auto 0 0;
            z-index: 0;
            height: 27%;
            border-top: 12px solid var(--wood-dark);
            content: '';
            background:
                linear-gradient(90deg, transparent calc(50% - 2px), rgba(77, 70, 49, 0.34) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)),
                repeating-linear-gradient(90deg, transparent 0 124px, rgba(77, 70, 49, 0.26) 125px 128px),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 6px),
                var(--tatami);
            box-shadow: inset 0 10px 20px rgba(40, 27, 22, 0.12);
        }

        .home-layout {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(300px, 0.9fr) minmax(330px, 0.8fr);
            width: min(1040px, 100%);
            align-items: center;
            gap: clamp(42px, 7vw, 92px);
        }

        .home-copy {
            position: relative;
            z-index: 1;
            padding: clamp(28px, 4vw, 48px) clamp(26px, 4vw, 46px);
            border-top: 5px solid var(--wood);
            border-bottom: 5px solid var(--wood);
            background:
                linear-gradient(90deg, rgba(163, 67, 54, 0.04), transparent 15% 85%, rgba(163, 67, 54, 0.04)),
                rgba(255, 253, 248, 0.9);
            box-shadow: 0 18px 48px rgba(40, 27, 22, 0.12);
            text-align: center;
        }

        .home-copy::before,
        .home-copy::after {
            position: absolute;
            top: -9px;
            width: 13px;
            height: calc(100% + 18px);
            border-radius: 3px;
            content: '';
            background: var(--wood-dark);
        }

        .home-copy::before { left: -7px; }
        .home-copy::after { right: -7px; }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--red);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.3em;
        }

        .home-title {
            margin: 0;
            color: var(--ink);
            font-family: "YuKyokasho", "Klee", var(--display);
            font-size: clamp(54px, 6.4vw, 84px);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.96;
        }

        .home-title span {
            display: block;
        }

        .home-title small {
            display: block;
            margin-top: 16px;
            color: var(--red-dark);
            font-family: var(--jp-ui);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.3em;
        }

        .home-lead {
            max-width: 410px;
            margin: 25px auto 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .home-actions {
            width: min(340px, 100%);
            margin: 30px auto 0;
        }

        .primary-button {
            display: flex;
            width: 100%;
            min-height: 60px;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 0 26px;
            border: 1px solid var(--wood-dark);
            border-radius: 2px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 42%),
                var(--wood-dark);
            box-shadow: 0 5px 0 rgba(40, 27, 22, 0.2);
            color: #fffdf8;
            font-size: 15px;
            font-weight: 850;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        .primary-button:hover {
            background: var(--red-dark);
            box-shadow: 0 3px 0 rgba(40, 27, 22, 0.2);
            transform: translateY(2px);
        }

        .primary-button span:last-child {
            font-size: 20px;
            font-weight: 400;
        }

        .home-help {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .home-help summary {
            display: inline-flex;
            min-height: 36px;
            align-items: center;
            cursor: pointer;
            list-style: none;
            text-decoration: underline;
            text-decoration-color: rgba(109, 108, 102, 0.36);
            text-underline-offset: 4px;
        }

        .home-help summary::-webkit-details-marker {
            display: none;
        }

        .home-help p {
            margin: 5px 0 0;
            line-height: 1.65;
        }

        .best-score-panel {
            display: flex;
            min-height: 46px;
            align-items: baseline;
            justify-content: center;
            gap: 7px;
            margin-top: 11px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: rgba(255, 253, 248, 0.72);
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .home-view .best-score-panel {
            display: grid;
            grid-template-columns: max-content minmax(1.5ch, max-content) max-content;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 18px;
            border: 3px double rgba(86, 57, 46, 0.68);
            background: #fffdf8;
            box-shadow: inset 0 0 0 2px rgba(180, 138, 50, 0.08);
            line-height: 1;
        }

        .home-view .best-score-panel > span,
        .home-view .best-score-panel > small {
            display: block;
            line-height: 1;
        }

        .home-view .best-score-panel > strong {
            min-width: 1.5ch;
            text-align: center;
            transform: translateY(-1px);
        }

        .best-score-panel strong {
            color: var(--ink);
            font-family: var(--display);
            font-size: 25px;
            line-height: 1;
            letter-spacing: 0;
        }

        .best-score-panel small {
            font-size: 10px;
            letter-spacing: 0;
        }

        .best-score-panel.is-new {
            border-color: rgba(163, 67, 54, 0.58);
            background: #f5e8e2;
            color: var(--red-dark);
        }

        .best-score-panel.is-new strong {
            color: var(--red-dark);
        }

        .home-mascot {
            width: min(540px, 100%);
            align-self: end;
            margin: 0 auto -8px;
            filter: drop-shadow(0 22px 22px rgba(40, 27, 22, 0.2));
            transform: translate(-4%, 54px) scale(1.06);
            transform-origin: center bottom;
        }

        .home-mascot img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Settings */
        .settings-button {
            position: absolute;
            top: max(22px, env(safe-area-inset-top));
            right: max(24px, env(safe-area-inset-right));
            z-index: 3;
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            border: 2px solid rgba(40, 27, 22, 0.78);
            border-radius: 50%;
            background: rgba(255, 253, 248, 0.9);
            color: var(--ink);
            cursor: pointer;
            transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
        }

        .settings-button:hover {
            border-color: rgba(163, 67, 54, 0.42);
            background: #fff;
            transform: rotate(12deg);
        }

        .settings-button svg {
            width: 23px;
            height: 23px;
        }

        .settings-button.has-filter::after {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 9px;
            height: 9px;
            border: 2px solid var(--paper);
            border-radius: 50%;
            background: var(--red);
            content: "";
        }

        .settings-dialog {
            width: min(430px, calc(100% - 30px));
            max-height: calc(100dvh - 34px);
            padding: 0;
            overflow: auto;
            border: 7px double var(--wood-dark);
            border-radius: 2px;
            background:
                repeating-linear-gradient(0deg, transparent 0 23px, rgba(28, 29, 26, 0.02) 24px),
                #fffdf8;
            color: var(--ink);
            box-shadow: 0 26px 90px rgba(28, 29, 26, 0.24);
        }

        .settings-dialog::backdrop {
            background: rgba(28, 29, 26, 0.42);
            backdrop-filter: blur(3px);
        }

        .settings-form {
            padding: 28px;
        }

        .settings-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 17px;
            border-bottom: 2px solid rgba(86, 57, 46, 0.36);
        }

        .settings-header .eyebrow {
            margin-bottom: 7px;
        }

        .settings-header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 850;
        }

        .settings-close {
            display: grid;
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            place-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 25px;
            cursor: pointer;
        }

        .settings-group {
            margin: 0;
            padding: 0;
            border: 0;
        }

        .settings-group + .settings-group {
            margin-top: 22px;
        }

        .settings-group legend {
            margin-bottom: 10px;
            padding: 0;
            font-size: 12px;
            font-weight: 850;
        }

        .settings-options {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
        }

        .settings-options.levels {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .settings-options.forms {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .settings-options.modes {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .settings-options.modes .settings-choice-content {
            min-height: 66px;
        }

        .settings-choice {
            position: relative;
            cursor: pointer;
        }

        .settings-choice input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .settings-choice-content {
            display: flex;
            min-height: 58px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 3px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.52);
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            transition: border-color 130ms ease, background-color 130ms ease, color 130ms ease;
        }

        .settings-choice-content strong {
            color: inherit;
            font-size: 13px;
        }

        .settings-choice-content small {
            font-size: 9px;
        }

        .settings-choice input:checked + .settings-choice-content {
            border-color: var(--ink);
            background: var(--ink);
            color: #fff;
        }

        .settings-choice.is-core input:not(:checked) + .settings-choice-content {
            border-color: rgba(163, 67, 54, 0.38);
            background: rgba(163, 67, 54, 0.055);
            color: var(--red-dark);
        }

        .settings-choice input:focus-visible + .settings-choice-content {
            outline: 2px solid rgba(163, 67, 54, 0.52);
            outline-offset: 3px;
        }

        .settings-error {
            min-height: 18px;
            margin: 12px 0 0;
            color: var(--error);
            font-size: 11px;
            text-align: center;
        }

        .settings-actions {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 9px;
            margin-top: 10px;
        }

        .settings-reset,
        .settings-save {
            min-height: 48px;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .settings-reset {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
        }

        .settings-save {
            border: 0;
            background: var(--ink);
            color: #fff;
        }

        /* Countdown */
        .countdown-view {
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.92) 0 27%, transparent 46%),
                repeating-linear-gradient(90deg, transparent 0 116px, rgba(86, 57, 46, 0.12) 117px 122px),
                repeating-linear-gradient(0deg, transparent 0 103px, rgba(86, 57, 46, 0.1) 104px 109px),
                var(--shoji);
            box-shadow: inset 0 18px var(--wood-dark), inset 16px 0 var(--wood-dark), inset -16px 0 var(--wood-dark);
            text-align: center;
        }

        .countdown-view::before,
        .countdown-view::after {
            position: absolute;
            width: min(66vw, 640px);
            aspect-ratio: 1;
            border: 1px solid rgba(28, 29, 26, 0.09);
            border-radius: 50%;
            content: "";
        }

        .countdown-view::after {
            width: min(48vw, 460px);
            border-style: dashed;
        }

        .countdown-stage {
            position: relative;
            z-index: 1;
            min-width: min(340px, calc(100% - 40px));
        }

        .countdown-ready {
            min-height: 28px;
            margin: 0 0 8px;
            color: var(--red-dark);
            font-size: clamp(17px, 3vw, 23px);
            font-weight: 850;
            letter-spacing: 0.24em;
        }

        .countdown-number {
            display: grid;
            min-height: 176px;
            place-items: center;
            margin: 0;
            font-family: var(--display);
            font-size: clamp(118px, 20vw, 190px);
            font-weight: 700;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
        }

        .countdown-number.is-pop {
            animation: countdown-pop 820ms cubic-bezier(0.2, 0.82, 0.25, 1) both;
        }

        .countdown-number.is-start {
            color: var(--red-dark);
            font-size: clamp(52px, 10vw, 88px);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        @keyframes countdown-pop {
            0% {
                opacity: 0;
                transform: scale(1.38);
            }
            28% {
                opacity: 1;
                transform: scale(0.94);
            }
            48% {
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Match the kanji-reading game's countdown presentation. */
        .countdown-view {
            display: grid;
            place-items: center;
            z-index: 30;
            overflow: hidden;
            background: #fbf8f0;
            box-shadow: none;
            text-align: center;
        }

        .countdown-view::before,
        .countdown-view::after {
            display: none;
        }

        .countdown-stage {
            position: relative;
            min-width: 0;
        }

        .countdown-ready {
            height: 36px;
            min-height: 0;
            margin: 0;
            color: #a33e31;
            font: 700 18px/1 "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            letter-spacing: 0.28em;
        }

        .countdown-number {
            display: block;
            min-width: 280px;
            min-height: 0;
            margin: 0;
            color: var(--ink);
            font: 900 clamp(110px, 20vw, 230px)/1 "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
            font-variant-numeric: tabular-nums;
        }

        .countdown-number.is-pop {
            animation: countdown-pop 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .countdown-number.is-start {
            color: var(--ink);
            font-size: clamp(72px, 12vw, 144px);
            letter-spacing: 0.08em;
        }

        @keyframes countdown-pop {
            0% { opacity: 0; transform: scale(0.35) rotate(-8deg); }
            50% { opacity: 1; transform: scale(1.08) rotate(1deg); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Practice */
        .practice-view {
            position: relative;
            display: grid;
            place-items: center;
            padding: 84px clamp(28px, 6vw, 88px) 106px;
            overflow: hidden;
            background-color: var(--paper-light);
            background-image:
                radial-gradient(circle at 0 100%, transparent 0 47px, rgba(28, 29, 26, 0.04) 48px 50px, transparent 51px),
                radial-gradient(circle at 100% 100%, transparent 0 47px, rgba(28, 29, 26, 0.04) 48px 50px, transparent 51px);
            background-size: 100px 50px;
            border-top: 15px solid var(--wood-dark);
            box-shadow: inset 15px 0 rgba(86, 57, 46, 0.2), inset -15px 0 rgba(86, 57, 46, 0.2);
        }

        .practice-app-header,
        .practice-tools {
            display: contents;
        }

        .hud {
            position: absolute;
            top: max(25px, env(safe-area-inset-top));
            left: 50%;
            display: flex;
            width: min(920px, calc(100% - 56px));
            align-items: center;
            justify-content: center;
            transform: translateX(-50%);
        }

        .score,
        .timer,
        .streak {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
        }

        .score {
            position: absolute;
            left: 0;
            color: var(--muted);
        }

        .score strong {
            display: inline-block;
            margin-left: 5px;
            color: var(--ink);
            font-size: 18px;
            font-variant-numeric: tabular-nums;
        }

        .score.is-punch strong {
            animation: hud-score-punch 420ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .timer {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            font-variant-numeric: tabular-nums;
        }

        .timer span {
            margin-right: 3px;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 0.16em;
        }

        .timer strong {
            min-width: 34px;
            font-size: 23px;
            line-height: 1;
            text-align: right;
        }

        .timer small {
            color: var(--muted);
            font-size: 10px;
        }

        .timer.is-urgent {
            color: var(--red-dark);
        }

        .streak {
            position: absolute;
            right: 0;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
        }

        .streak strong {
            min-width: 20px;
            color: var(--ink);
            font-size: 18px;
        }

        .streak-dot {
            width: 9px;
            height: 9px;
            border: 2px solid var(--muted);
            border-radius: 50%;
        }

        .streak.is-live .streak-dot {
            border-color: var(--red);
            background: var(--red);
        }

        .streak.is-punch strong,
        .streak.is-punch .streak-dot {
            animation: hud-combo-punch 420ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .question-shell {
            position: relative;
            z-index: 1;
            width: min(790px, 100%);
            text-align: center;
            transition: opacity 140ms ease, transform 180ms ease;
        }

        .practice-view.is-brush-hit .question-shell {
            opacity: 0.14;
            transform: scale(0.985);
        }

        .question-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .question-meta span {
            display: inline-flex;
            min-height: 28px;
            align-items: center;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.72);
        }

        .verb-word {
            margin: 22px 0 0;
            font-family: var(--display);
            font-size: clamp(58px, 7vw, 86px);
            font-weight: 700;
            line-height: 1.15;
        }

        .verb-word rt {
            font-family: var(--ui);
            font-size: 0.28em;
            font-weight: 600;
        }

        .verb-word ruby {
            ruby-align: center;
        }

        .question-copy {
            margin: 17px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .answer-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px;
            width: min(620px, 100%);
            gap: 12px;
            margin: 34px auto 0;
        }

        .answer-field {
            position: relative;
            min-width: 0;
        }

        .input-target {
            position: absolute;
            top: 50%;
            left: 13px;
            z-index: 1;
            display: inline-flex;
            min-width: 72px;
            min-height: 34px;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            border-radius: 3px;
            transform: translateY(-50%);
            background: var(--ink);
            color: #fff;
            font-size: 12px;
            font-weight: 850;
            letter-spacing: 0.04em;
            pointer-events: none;
            transition: background-color 130ms ease;
        }

        .answer-input {
            width: 100%;
            min-width: 0;
            min-height: 64px;
            padding: 8px 18px 8px 108px;
            border: 0;
            border-bottom: 4px solid rgba(28, 29, 26, 0.86);
            border-radius: 0;
            outline: 0;
            background: rgba(255, 255, 255, 0.62);
            color: var(--ink);
            font-family: var(--display);
            font-size: clamp(26px, 3vw, 35px);
            font-weight: 700;
            text-align: left;
            transition: border-color 130ms ease, background-color 130ms ease, color 130ms ease;
        }

        .answer-input::placeholder {
            color: #a5a49d;
            font-family: var(--cn);
            font-size: 13px;
            font-weight: 500;
        }

        .answer-input:focus {
            border-bottom-color: var(--red);
            background: rgba(255, 255, 255, 0.92);
        }

        .answer-field:focus-within .input-target {
            background: var(--red-dark);
        }

        .answer-input.is-correct {
            border-bottom-color: var(--green);
            background: #edf4ed;
            color: #35533d;
        }

        .answer-input.is-wrong {
            border-bottom-color: var(--error);
            background: #f8ece9;
            color: #7f3028;
        }

        .answer-input.is-locked {
            caret-color: transparent;
        }

        .answer-submit {
            min-height: 56px;
            padding: 0 14px;
            border: 0;
            border-radius: 3px;
            background: var(--ink);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 130ms ease, opacity 130ms ease;
        }

        .answer-submit:hover:not(:disabled) {
            background: var(--red-dark);
        }

        .answer-submit:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .romaji-keyboard {
            display: none;
        }

        .hint-text,
        .feedback {
            min-height: 24px;
            margin: 15px 0 0;
            font-size: 13px;
            font-weight: 650;
            line-height: 1.6;
        }

        .hint-text {
            color: var(--muted);
        }

        .feedback {
            margin-top: 6px;
        }

        .feedback.is-correct {
            color: var(--green);
        }

        .feedback.is-wrong {
            color: var(--error);
        }

        /* Correct-answer feedback: sumi brush, red seal, and ink splashes. */
        .brush-feedback {
            --brush-accent: var(--red);
            --brush-ink: rgba(28, 29, 26, 0.94);
            position: absolute;
            inset: 0;
            z-index: 6;
            display: grid;
            place-items: center;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .brush-feedback.is-active {
            opacity: 1;
            visibility: visible;
        }

        .brush-sweep,
        .brush-enso,
        .ink-particles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .brush-sweep {
            width: min(650px, 94vw);
            height: clamp(102px, 16vw, 150px);
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-3deg) scaleX(0.12);
            transform-origin: 13% 50%;
        }

        .brush-sweep::before {
            position: absolute;
            inset: 16% 0 10%;
            content: '';
            background:
                linear-gradient(90deg, transparent 0 1%, rgba(28, 29, 26, 0.14) 7% 88%, transparent 98%),
                repeating-linear-gradient(177deg, transparent 0 5px, rgba(255, 253, 248, 0.6) 6px 7px);
            clip-path: polygon(0 45%, 4% 25%, 12% 18%, 18% 6%, 29% 15%, 39% 5%, 51% 13%, 63% 2%, 73% 11%, 87% 7%, 100% 25%, 96% 48%, 100% 70%, 89% 82%, 77% 74%, 66% 94%, 52% 80%, 41% 93%, 29% 81%, 18% 92%, 8% 72%, 0 64%);
            filter: blur(0.2px);
        }

        .brush-sweep::after {
            position: absolute;
            right: 1%;
            bottom: 4%;
            width: 72%;
            height: 8px;
            content: '';
            background: linear-gradient(90deg, rgba(28, 29, 26, 0.76), rgba(28, 29, 26, 0.08) 86%, transparent);
            clip-path: polygon(0 24%, 94% 0, 100% 48%, 86% 68%, 0 100%);
        }

        .brush-feedback.is-active .brush-sweep {
            animation: brush-sweep-in 920ms cubic-bezier(0.12, 0.82, 0.22, 1) both;
        }

        .brush-enso {
            width: clamp(220px, 31vw, 330px);
            height: clamp(220px, 31vw, 330px);
            overflow: visible;
            opacity: 0.88;
            transform: translate(-50%, -50%) rotate(-10deg);
        }

        .brush-enso path {
            fill: none;
            stroke: var(--brush-accent);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 560;
            stroke-dashoffset: 560;
            filter: drop-shadow(1px 2px 0 rgba(255, 253, 248, 0.72));
        }

        .brush-feedback.tier-3 .brush-enso path,
        .brush-feedback.tier-4 .brush-enso path {
            stroke-width: 11;
        }

        .brush-feedback.tier-3 .brush-seal,
        .brush-feedback.tier-4 .brush-seal {
            box-shadow: inset 0 0 0 3px rgba(163, 67, 54, 0.32), 0 0 0 3px rgba(255, 253, 248, 0.82);
        }

        .brush-feedback.is-active .brush-enso path {
            animation: enso-draw 760ms cubic-bezier(0.3, 0.7, 0.24, 1) both;
        }

        .brush-copy {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: auto auto;
            grid-template-areas:
                'judge seal'
                'points seal';
            align-items: center;
            column-gap: 15px;
            opacity: 0;
            transform: translateY(9px) rotate(-2deg) scale(1.4);
        }

        .brush-feedback.is-active .brush-copy {
            animation: brush-copy-hit 1050ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .brush-judge {
            grid-area: judge;
            color: var(--ink);
            font-family: "YuKyokasho", "Klee", "Hiragino Mincho ProN", "Noto Serif JP", serif;
            font-size: clamp(70px, 11vw, 128px);
            font-weight: 900;
            letter-spacing: -0.12em;
            line-height: 0.88;
            text-shadow:
                1px 0 0 rgba(28, 29, 26, 0.76),
                -1px 1px 0 rgba(28, 29, 26, 0.44),
                4px 5px 0 rgba(255, 253, 248, 0.88);
            white-space: nowrap;
        }

        .brush-seal {
            grid-area: seal;
            display: grid;
            width: clamp(76px, 10vw, 104px);
            aspect-ratio: 1;
            place-items: center;
            border: 4px double var(--brush-accent);
            box-shadow: inset 0 0 0 2px rgba(163, 67, 54, 0.24);
            transform: rotate(7deg);
            background: rgba(255, 253, 248, 0.9);
            color: var(--brush-accent);
            font-family: var(--display);
            line-height: 0.82;
        }

        .brush-seal strong {
            align-self: end;
            font-size: clamp(33px, 5vw, 48px);
            font-variant-numeric: tabular-nums;
            font-weight: 900;
        }

        .brush-seal small {
            align-self: start;
            font-size: clamp(14px, 2vw, 20px);
            font-weight: 900;
            letter-spacing: 0.08em;
        }

        .brush-points {
            grid-area: points;
            justify-self: center;
            margin-top: 12px;
            padding: 3px 12px;
            border-left: 2px solid var(--brush-accent);
            border-right: 2px solid var(--brush-accent);
            background: rgba(255, 253, 248, 0.86);
            color: var(--brush-accent);
            font-family: var(--ui);
            font-size: 14px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.12em;
        }

        .ink-particles {
            z-index: 1;
            width: 1px;
            height: 1px;
        }

        .ink-drop {
            --ink-angle: 0deg;
            --ink-distance: 130px;
            --ink-size: 6px;
            --ink-delay: 0ms;
            position: absolute;
            top: calc(var(--ink-size) / -2);
            left: calc(var(--ink-size) / -2);
            width: calc(var(--ink-size) * 1.5);
            height: var(--ink-size);
            border-radius: 60% 38% 55% 42%;
            background: var(--brush-ink);
            opacity: 0;
            transform: rotate(var(--ink-angle)) translateX(24px) scale(0.25);
        }

        .ink-drop.is-vermilion {
            background: var(--brush-accent);
        }

        .ink-drop.is-round {
            width: var(--ink-size);
            border-radius: 50%;
        }

        .brush-feedback.is-active .ink-drop {
            animation: ink-drop-flight 780ms cubic-bezier(0.12, 0.76, 0.26, 1) var(--ink-delay) both;
        }

        @keyframes brush-sweep-in {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scaleX(0.08); }
            15% { opacity: 0.96; }
            48%, 75% { opacity: 0.96; transform: translate(-50%, -50%) rotate(-2deg) scaleX(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(-1deg) scaleX(1.04); }
        }

        @keyframes enso-draw {
            0% { opacity: 0; stroke-dashoffset: 560; }
            12% { opacity: 1; }
            70% { opacity: 0.95; stroke-dashoffset: 0; }
            100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes brush-copy-hit {
            0% { opacity: 0; filter: blur(7px); transform: translateY(13px) rotate(-5deg) scale(1.65); }
            15% { opacity: 1; filter: blur(0); transform: translateY(-5px) rotate(1deg) scale(0.92); }
            27% { transform: translateY(0) rotate(-2deg) scale(1.03); }
            40%, 75% { opacity: 1; transform: translateY(0) rotate(-2deg) scale(1); }
            100% { opacity: 0; transform: translateY(-15px) rotate(-2deg) scale(1.01); }
        }

        @keyframes ink-drop-flight {
            0% { opacity: 0; transform: rotate(var(--ink-angle)) translateX(22px) scale(0.2); }
            14% { opacity: 0.9; }
            100% { opacity: 0; transform: rotate(var(--ink-angle)) translateX(var(--ink-distance)) scale(0.12); }
        }

        @keyframes hud-score-punch {
            0% { color: var(--ink); transform: scale(1); }
            35% { color: var(--red); transform: scale(1.42) rotate(-3deg); }
            100% { color: var(--ink); transform: scale(1); }
        }

        @keyframes hud-combo-punch {
            0% { transform: scale(1); }
            38% { transform: scale(1.46) rotate(4deg); }
            100% { transform: scale(1); }
        }

        .corner-action {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            display: flex;
            min-width: 64px;
            align-items: center;
            flex-direction: column;
            gap: 7px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--ink);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .exit-button {
            left: clamp(24px, 5vw, 72px);
        }

        .hint-button {
            right: clamp(24px, 5vw, 72px);
        }

        .skip-button {
            right: clamp(24px, 5vw, 72px);
            bottom: calc(max(24px, env(safe-area-inset-bottom)) + 84px);
        }

        .corner-icon {
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            font-size: 21px;
            font-weight: 900;
            line-height: 1;
        }

        .hint-button .corner-icon {
            font-family: Georgia, serif;
            font-style: italic;
        }

        .corner-icon-wrap {
            position: relative;
            display: inline-grid;
        }

        .corner-count {
            position: absolute;
            top: -7px;
            right: -9px;
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border: 2px solid var(--paper-light);
            border-radius: 50%;
            background: #fff;
            color: var(--ink);
            font-size: 11px;
            font-weight: 900;
            font-style: normal;
            line-height: 1;
        }

        .corner-action:disabled {
            opacity: 0.38;
            cursor: default;
        }

        /* Time-up transition */
        .ending-view {
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.82), transparent 48%),
                repeating-linear-gradient(90deg, transparent 0 116px, rgba(86, 57, 46, 0.12) 117px 122px),
                repeating-linear-gradient(0deg, transparent 0 103px, rgba(86, 57, 46, 0.1) 104px 109px),
                var(--shoji);
            box-shadow: inset 0 18px var(--wood-dark), inset 16px 0 var(--wood-dark), inset -16px 0 var(--wood-dark);
        }

        .ending-stage {
            position: relative;
            display: grid;
            width: min(720px, 100%);
            min-height: 340px;
            place-items: center;
        }

        .ending-brush {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(720px, 108vw);
            height: clamp(120px, 19vw, 178px);
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-3deg) scaleX(0.05);
            transform-origin: 8% 50%;
        }

        .ending-brush::before {
            position: absolute;
            inset: 12% 0;
            content: '';
            background:
                linear-gradient(90deg, transparent, rgba(28, 29, 26, 0.13) 8% 88%, transparent),
                repeating-linear-gradient(176deg, transparent 0 6px, rgba(255, 253, 248, 0.62) 7px 9px);
            clip-path: polygon(0 45%, 6% 24%, 17% 14%, 28% 3%, 39% 16%, 50% 4%, 63% 13%, 74% 0, 86% 12%, 100% 29%, 96% 51%, 100% 72%, 87% 87%, 75% 76%, 64% 96%, 51% 81%, 39% 93%, 27% 79%, 15% 91%, 5% 70%, 0 63%);
        }

        .ending-brush::after {
            position: absolute;
            right: 0;
            bottom: 3%;
            width: 74%;
            height: 9px;
            content: '';
            background: linear-gradient(90deg, rgba(28, 29, 26, 0.72), rgba(163, 67, 54, 0.42) 72%, transparent);
            clip-path: polygon(0 30%, 93% 0, 100% 48%, 86% 72%, 0 100%);
        }

        .ending-stage.is-active .ending-brush {
            animation: ending-brush-pass 920ms cubic-bezier(0.12, 0.82, 0.22, 1) both;
        }

        .ending-calligraphy {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: rotate(-4deg) scale(1.55);
        }

        .ending-stage.is-active .ending-calligraphy {
            animation: ending-calligraphy-hit 920ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .ending-calligraphy strong {
            color: var(--ink);
            font-family: "YuKyokasho", "Klee", "Hiragino Mincho ProN", "Noto Serif JP", serif;
            font-size: clamp(78px, 13vw, 142px);
            font-weight: 900;
            letter-spacing: -0.14em;
            line-height: 0.9;
            text-shadow: 1px 0 rgba(28, 29, 26, 0.78), -1px 1px rgba(28, 29, 26, 0.46), 5px 6px rgba(255, 253, 248, 0.9);
            white-space: nowrap;
        }

        .ending-seal {
            display: grid;
            width: clamp(60px, 8vw, 82px);
            aspect-ratio: 1;
            place-items: center;
            border: 4px double var(--red);
            transform: rotate(8deg);
            background: rgba(255, 253, 248, 0.9);
            color: var(--red);
            font-family: var(--display);
            font-size: clamp(23px, 3.2vw, 33px);
            font-weight: 900;
        }

        @keyframes ending-brush-pass {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scaleX(0.05); }
            14% { opacity: 1; }
            48%, 74% { opacity: 1; transform: translate(-50%, -50%) rotate(-2deg) scaleX(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(-1deg) scaleX(1.04); }
        }

        @keyframes ending-calligraphy-hit {
            0% { opacity: 0; filter: blur(7px); transform: translateY(12px) rotate(-7deg) scale(1.62); }
            17% { opacity: 1; filter: blur(0); transform: translateY(-4px) rotate(1deg) scale(0.92); }
            31% { transform: translateY(0) rotate(-2deg) scale(1.03); }
            42%, 72% { opacity: 1; transform: translateY(0) rotate(-2deg) scale(1); }
            100% { opacity: 0; transform: translateY(-14px) rotate(-2deg) scale(1.02); }
        }

        /* Result */
        .result-view {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 32px 24px;
            overflow: hidden;
            text-align: center;
            background:
                linear-gradient(0deg, rgba(183, 170, 119, 0.78) 0 15%, transparent 15.2%),
                repeating-linear-gradient(90deg, transparent 0 116px, rgba(86, 57, 46, 0.12) 117px 122px),
                repeating-linear-gradient(0deg, transparent 0 103px, rgba(86, 57, 46, 0.1) 104px 109px),
                var(--shoji);
            box-shadow: inset 0 18px var(--wood-dark), inset 16px 0 var(--wood-dark), inset -16px 0 var(--wood-dark), inset 0 -12px var(--wood-dark);
        }

        .result-view > :not(.new-record-effect) {
            position: relative;
            z-index: 2;
        }

        .result-scroll {
            width: min(430px, calc(100% - 16px));
            min-height: min(540px, calc(100dvh - 58px));
            filter: drop-shadow(0 22px 32px rgba(28, 29, 26, 0.14));
        }

        .scroll-sheet {
            position: relative;
            display: grid;
            width: calc(100% - 30px);
            min-height: inherit;
            margin: 0 auto;
            place-items: center;
            padding: 62px 34px 56px;
            overflow: hidden;
            border-right: 1px solid rgba(163, 67, 54, 0.18);
            border-left: 1px solid rgba(163, 67, 54, 0.18);
            background:
                linear-gradient(90deg, rgba(163, 67, 54, 0.045), transparent 9% 91%, rgba(163, 67, 54, 0.045)),
                repeating-linear-gradient(0deg, transparent 0 25px, rgba(28, 29, 26, 0.018) 26px),
                #fffdf8;
            clip-path: inset(50% 0 50% 0);
            transform: scaleY(0.05);
            transform-origin: center;
        }

        .scroll-content {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
        }

        .scroll-rod {
            position: absolute;
            left: 0;
            z-index: 3;
            width: 100%;
            height: 17px;
            border: 1px solid rgba(28, 29, 26, 0.68);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 38%),
                linear-gradient(90deg, var(--ink), #64443a 18% 82%, var(--ink));
            box-shadow: 0 3px 0 rgba(28, 29, 26, 0.12);
        }

        .scroll-rod::before,
        .scroll-rod::after {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 24px;
            border: 1px solid rgba(28, 29, 26, 0.76);
            border-radius: 3px;
            content: '';
            background: var(--ink);
            transform: translateY(-50%);
        }

        .scroll-rod::before {
            left: -4px;
        }

        .scroll-rod::after {
            right: -4px;
        }

        .scroll-rod-top {
            top: 50%;
            transform: translateY(-50%);
        }

        .scroll-rod-bottom {
            bottom: 50%;
            transform: translateY(50%);
        }

        .result-view.is-unfurling .scroll-sheet {
            animation: scroll-sheet-unfurl 1200ms cubic-bezier(0.65, 0, 0.35, 1) both;
        }

        .result-view.is-unfurling .scroll-rod-top {
            animation: scroll-rod-top-open 1200ms cubic-bezier(0.65, 0, 0.35, 1) both;
        }

        .result-view.is-unfurling .scroll-rod-bottom {
            animation: scroll-rod-bottom-open 1200ms cubic-bezier(0.65, 0, 0.35, 1) both;
        }

        .result-view.is-unfurling .scroll-content {
            animation: scroll-content-reveal 1320ms 100ms ease both;
        }

        .result-view h1 {
            margin: 0;
            font-family: var(--cn);
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 800;
        }

        .result-score {
            display: inline-flex;
            align-items: baseline;
            gap: 7px;
            margin: 8px 0 0;
            font-family: var(--display);
            font-size: clamp(58px, 8vw, 84px);
            font-weight: 700;
            line-height: 1;
        }

        .result-score strong {
            font: inherit;
            font-variant-numeric: tabular-nums;
        }

        .result-score small {
            color: var(--muted);
            font-family: var(--jp-ui);
            font-size: 12px;
            font-weight: 800;
        }

        .result-score-label {
            margin: 25px 0 0;
            color: var(--red-dark);
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.18em;
        }

        .result-actions {
            display: flex;
            width: min(340px, 100%);
            margin-top: 27px;
            flex-direction: column;
            gap: 9px;
        }

        .result-view > .result-best-plaque {
            position: absolute;
            top: 50%;
            left: calc(50% + 244px);
            z-index: 3;
            display: flex;
            width: 154px;
            min-height: 170px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin: 0;
            padding: 25px 17px 20px;
            border: 7px double var(--wood-dark);
            border-radius: 2px;
            flex-direction: column;
            background:
                linear-gradient(90deg, rgba(163, 67, 54, 0.055), transparent 18% 82%, rgba(163, 67, 54, 0.055)),
                repeating-linear-gradient(0deg, transparent 0 18px, rgba(28, 29, 26, 0.024) 19px),
                #fffdf8;
            box-shadow: 0 14px 26px rgba(40, 27, 22, 0.18), inset 0 0 0 2px rgba(180, 138, 50, 0.14);
            opacity: 0;
            transform: translateY(-50%) rotate(2deg);
        }

        .result-best-plaque::before {
            position: absolute;
            top: -21px;
            left: 50%;

        @keyframes scroll-sheet-unfurl {

            18% { clip-path: inset(43% 0 43% 0); transform: scaleY(0.16); }

        @keyframes scroll-rod-top-open {

        @keyframes scroll-content-reveal {

            78% { opacity: 1; transform: translateY(-2px); }

        /* New-record ceremony: the same sumi-and-seal language as a correct hit. */
        .new-record-effect {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: grid;
            place-items: center;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .new-record-effect::before {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(760px, 116vw);
            height: min(470px, 72vh);
            content: '';
            background: radial-gradient(ellipse, rgba(252, 250, 245, 0.98) 0 42%, rgba(246, 243, 235, 0.88) 62%, transparent 78%);
            transform: translate(-50%, -50%);
        }

        .result-view.is-new-record .new-record-effect {
            visibility: visible;
            animation: record-layer-lifetime 1950ms ease both;
        }

        .record-brush-sweep,
        .record-enso,
        .record-particles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .record-brush-sweep {
            z-index: 1;
            width: min(760px, 108vw);
            height: clamp(138px, 22vw, 210px);
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-2deg) scaleX(0.05);
            transform-origin: 10% 50%;
        }

        .record-brush-sweep::before {
            position: absolute;
            inset: 12% 0 12%;
            content: '';
            background:
                linear-gradient(90deg, transparent 0, rgba(180, 138, 50, 0.1) 5%, rgba(180, 138, 50, 0.23) 18% 78%, rgba(163, 67, 54, 0.12) 91%, transparent 100%),
                repeating-linear-gradient(176deg, transparent 0 7px, rgba(255, 253, 248, 0.72) 8px 10px);
            clip-path: polygon(0 46%, 4% 27%, 13% 18%, 22% 5%, 32% 16%, 43% 3%, 53% 12%, 66% 0, 77% 13%, 89% 5%, 100% 26%, 96% 47%, 100% 68%, 88% 84%, 76% 73%, 65% 96%, 53% 80%, 42% 94%, 31% 78%, 18% 92%, 7% 73%, 0 64%);
        }

        .record-brush-sweep::after {
            position: absolute;
            right: 2%;
            bottom: 3%;
            width: 78%;
            height: 10px;
            content: '';
            background: linear-gradient(90deg, rgba(28, 29, 26, 0.66), rgba(163, 67, 54, 0.36) 68%, transparent);
            clip-path: polygon(0 28%, 92% 0, 100% 46%, 87% 72%, 0 100%);
        }

        .result-view.is-new-record .record-brush-sweep {
            animation: record-sweep-in 1500ms cubic-bezier(0.12, 0.82, 0.22, 1) both;
        }

        .record-enso {
            z-index: 1;
            width: clamp(290px, 43vw, 450px);
            height: clamp(290px, 43vw, 450px);
            overflow: visible;
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .record-enso path {
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 620;
            stroke-dashoffset: 620;
        }

        .record-enso .record-enso-gold {
            stroke: var(--gold);
            stroke-width: 11;
            opacity: 0.82;
        }

        .record-enso .record-enso-red {
            stroke: var(--red);
            stroke-width: 5;
            opacity: 0.78;
            transform: rotate(8deg);
            transform-origin: center;
        }

        .result-view.is-new-record .record-enso-gold {
            animation: record-enso-draw 1120ms 90ms cubic-bezier(0.22, 0.72, 0.24, 1) both;
        }

        .result-view.is-new-record .record-enso-red {
            animation: record-enso-draw 980ms 190ms cubic-bezier(0.22, 0.72, 0.24, 1) both;
        }

        .record-calligraphy {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: clamp(13px, 2vw, 22px);
            opacity: 0;
            transform: translateY(10px) rotate(-3deg) scale(1.55);
        }

        .result-view.is-new-record .record-calligraphy {
            animation: record-calligraphy-hit 1680ms 100ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .record-calligraphy strong {
            color: var(--ink);
            font-family: "YuKyokasho", "Klee", "Hiragino Mincho ProN", "Noto Serif JP", serif;
            font-size: clamp(62px, 10vw, 116px);
            font-weight: 900;
            letter-spacing: -0.12em;
            line-height: 0.92;
            text-shadow: 1px 0 rgba(28, 29, 26, 0.72), -1px 1px rgba(28, 29, 26, 0.46), 5px 6px rgba(255, 253, 248, 0.88);
            white-space: nowrap;
        }

        .record-seal {
            display: grid;
            width: clamp(72px, 10vw, 100px);
            aspect-ratio: 1;
            place-items: center;
            border: 5px double var(--red);
            box-shadow: inset 0 0 0 2px rgba(163, 67, 54, 0.25), 0 0 0 3px rgba(255, 253, 248, 0.84);
            transform: rotate(8deg);
            background: rgba(255, 253, 248, 0.9);
            color: var(--red);
            font-family: var(--display);
            font-size: clamp(19px, 2.8vw, 28px);
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.05;
        }

        .record-particles {
            z-index: 2;
            width: 1px;
            height: 1px;
        }

        .record-drop {
            --record-angle: 0deg;
            --record-distance: 160px;
            --record-size: 6px;
            --record-delay: 0ms;
            position: absolute;
            top: calc(var(--record-size) / -2);
            left: calc(var(--record-size) / -2);
            width: calc(var(--record-size) * 1.55);
            height: var(--record-size);
            border-radius: 62% 36% 58% 40%;
            background: var(--ink);
            opacity: 0;
            transform: rotate(var(--record-angle)) translateX(28px) scale(0.2);
        }

        .record-drop.is-gold {
            background: var(--gold);
        }

        .record-drop.is-red {
            background: var(--red);
        }

        .record-drop.is-round {
            width: var(--record-size);
            border-radius: 50%;
        }

        .result-view.is-new-record .record-drop {
            animation: record-drop-flight 1050ms var(--record-delay) cubic-bezier(0.12, 0.76, 0.26, 1) both;
        }

        .result-view.is-new-record .result-score {
            animation: result-score-arrive 1950ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .result-view.is-new-record .eyebrow,
        .result-view.is-new-record h1,
        .result-view.is-new-record .result-actions {
            animation: result-content-arrive 1950ms ease both;
        }

        @keyframes record-layer-lifetime {
            0% { opacity: 0; }
            7%, 72% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes record-sweep-in {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scaleX(0.05); }
            13% { opacity: 1; }
            42%, 78% { opacity: 1; transform: translate(-50%, -50%) rotate(-2deg) scaleX(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(-1deg) scaleX(1.04); }
        }

        @keyframes record-enso-draw {
            0% { opacity: 0; stroke-dashoffset: 620; }
            12% { opacity: 0.9; }
            78% { opacity: 0.9; stroke-dashoffset: 0; }
            100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes record-calligraphy-hit {
            0% { opacity: 0; filter: blur(8px); transform: translateY(14px) rotate(-6deg) scale(1.62); }
            13% { opacity: 1; filter: blur(0); transform: translateY(-6px) rotate(1deg) scale(0.9); }
            24% { transform: translateY(0) rotate(-2deg) scale(1.04); }
            38%, 74% { opacity: 1; transform: translateY(0) rotate(-2deg) scale(1); }
            100% { opacity: 0; transform: translateY(-18px) rotate(-2deg) scale(1.02); }
        }

        @keyframes record-drop-flight {
            0% { opacity: 0; transform: rotate(var(--record-angle)) translateX(25px) scale(0.18); }
            13% { opacity: 0.92; }
            100% { opacity: 0; transform: rotate(var(--record-angle)) translateX(var(--record-distance)) scale(0.1); }
        }

        @keyframes result-content-arrive {
            0%, 61% { opacity: 0.05; transform: translateY(7px); }
            78% { opacity: 1; transform: translateY(-2px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes result-score-arrive {
            0%, 60% { opacity: 0.04; transform: scale(0.86); }
            78% { opacity: 1; color: var(--red-dark); transform: scale(1.13) rotate(-2deg); }
            100% { opacity: 1; color: var(--ink); transform: scale(1); }
        }

            function adaptiveStatsFor(item, create = false) {
                if (!item?.key) return null;
                if (!adaptiveHistory[item.key] && create) {
                    adaptiveHistory[item.key] = {
                        formId: item.formId,
                        seen: 0,
                        correct: 0,
                        wrong: 0,
                        hints: 0,
                        skips: 0,
                        slow: 0,
                        consecutiveCorrect: 0,
                        averageMs: 0,
                        priority: 1,
                        lastSeen: 0
                    };
                }
                return adaptiveHistory[item.key] || null;
            }

            function updateAdaptiveStats(item, outcome, elapsedMs = 0) {
                const stats = adaptiveStatsFor(item, true);
                if (!stats) return;
                stats.formId = item.formId;
                stats.lastSeen = Date.now();

                if (outcome === 'hint') {
                    stats.hints += 1;
                    stats.priority = Math.max(Number(stats.priority) || 1, 2.5);
                } else if (outcome === 'skip') {
                    stats.seen += 1;
                    stats.skips += 1;
                    stats.consecutiveCorrect = 0;
                    stats.priority = Math.max(Number(stats.priority) || 1, 3);
                } else if (outcome === 'wrong') {
                    stats.seen += 1;
                    stats.wrong += 1;
                    stats.consecutiveCorrect = 0;
                    stats.priority = 4;
                } else if (outcome === 'correct') {
                    stats.seen += 1;
                    stats.correct += 1;
                    stats.consecutiveCorrect += 1;
                    if (elapsedMs > 0) {
                        stats.averageMs = stats.averageMs > 0
                            ? Math.round((stats.averageMs * 0.72) + (elapsedMs * 0.28))
                            : Math.round(elapsedMs);
                    }
                    if (elapsedMs > timeBonusWindowSeconds * 1000) {
                        stats.slow += 1;
                        stats.priority = Math.max(Number(stats.priority) || 1, 1.8);
                    } else {
                        const decay = stats.consecutiveCorrect >= 2 ? 0.58 : 0.72;
                        stats.priority = Math.max(0.55, (Number(stats.priority) || 1) * decay);
                    }
                }
                saveAdaptiveHistory();
            }

            const romajiKeysByLength = Object.keys(romajiKanaMap)
                .sort((left, right) => right.length - left.length);
            const romajiPrefixes = new Set(romajiKeysByLength.flatMap((key) =>

            function convertRomaji(value, flush = false) {
                let remaining = String(value || '').toLowerCase();
                let kana = '';
                let segments = [];

                while (remaining) {
                    const first = remaining[0];
                    const second = remaining[1] || '';
                    if (first === '-') {
                        kana += 'ー';
                        segments.push({ raw: '-', kana: 'ー' });
                        remaining = remaining.slice(1);
                        continue;
                    }
                    if (first === second && first !== 'n' && /[bcdfghjklmpqrstvwxyz]/.test(first)) {
                        kana += 'っ';
                        segments.push({ raw: first, kana: 'っ' });
                        remaining = remaining.slice(1);
                        continue;
                    }
                    if (remaining.startsWith('tch')) {
                        kana += 'っ';
                        segments.push({ raw: first, kana: 'っ' });
                        remaining = remaining.slice(1);
                        continue;
                    }

                    if (remaining.startsWith("n'")) {
                        kana += 'ん';
                        segments.push({ raw: "n'", kana: 'ん' });
                        remaining = remaining.slice(2);
                        continue;
                    }
                    if (remaining.startsWith('nn')) {
                        kana += 'ん';
                        segments.push({ raw: 'nn', kana: 'ん' });
                        remaining = remaining.slice(2);
                        continue;
                    }
                    if (first === 'n' && remaining.length > 1 && !/[aiueoyn]/.test(second)) {
                        kana += 'ん';
                        segments.push({ raw: 'n', kana: 'ん' });
                        remaining = remaining.slice(1);
                        continue;
                    }

                    const matchedKey = romajiKeysByLength.find((key) => remaining.startsWith(key));
                    if (matchedKey) {
                        kana += romajiKanaMap[matchedKey];
                        segments.push({ raw: matchedKey, kana: romajiKanaMap[matchedKey] });
                        remaining = remaining.slice(matchedKey.length);
                        continue;
                    }

                    if (flush && remaining === 'n') {
                        kana += 'ん';
                        segments.push({ raw: 'n', kana: 'ん' });
                        remaining = '';
                        continue;
                    }

                    if (!flush && (romajiPrefixes.has(remaining) || 'tch'.startsWith(remaining))) break;
                    kana += first;
                    segments.push({ raw: first, kana: first });
                    remaining = remaining.slice(1);
                }

                return { kana, remaining, segments };
            }

            function adaptiveQuestionKey(verb, formId) {
                return `${verb.word}|${verb.reading}|${formId}`;
